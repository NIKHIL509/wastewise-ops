<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<title>WasteWise Ops · Daporijo</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{
  --green:#1B5E20; --green2:#2E7D32; --green3:#E8F5E9; --ink:#17231A; --ink2:#4A5A4E; --line:#DCE5DD;
  --bg:#F3F6F3; --card:#fff; --wet:#2E7D32; --dry:#0277BD; --mixed:#78909C; --warn:#F9A825; --bad:#C62828; --good:#2E7D32;
  --r:14px; --shadow:0 1px 2px rgba(20,40,25,.06),0 4px 14px rgba(20,40,25,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;min-height:100vh}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--green2)}
.hide{display:none!important}
/* header */
.top{position:sticky;top:0;z-index:50;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top))}
.top img{width:34px;height:34px;border-radius:8px;background:#fff;object-fit:contain}
.top .ttl{font-weight:700;font-size:16px;line-height:1.1}
.top .sub{font-size:11px;opacity:.8}
.top .sp{flex:1}
.tk3{position:relative;width:46px;height:46px}.tk3 .ring{position:absolute;left:5px;top:5px;width:36px;height:36px;border-radius:50%;background:rgba(46,125,50,.28);animation:tkring 1.6s ease-out infinite}
.tk3 .tkb{position:absolute;left:10px;top:0;width:26px;height:46px;transform-origin:13px 23px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.tk3 .tkl{position:absolute;left:50%;top:44px;transform:translateX(-50%);white-space:nowrap;background:#17231A;color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.tk3 *{pointer-events:none}.leaflet-marker-icon:has(.tk3.stopped) .ring,.stopped .ring{background:rgba(251,140,0,.35);animation-duration:2.6s}
.stale .ring{background:rgba(198,40,40,.4)}.stale .tkb{opacity:.6}
@keyframes tkring{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.35);opacity:0}}
body.gate #nav{display:none}
#nav a.out{margin-left:auto;color:#b3261b;font-weight:700}
.gate-card{max-width:440px;margin:18px auto;text-align:center}.gate-card .lg{display:flex;gap:14px;justify-content:center;align-items:center;margin-bottom:8px}.gate-card .lg img{width:76px;height:76px;border-radius:14px}.gate-card .lg img.sc{border-radius:50%}.gate-card .i{font-size:18px;text-align:center;letter-spacing:1px}
.opsw{white-space:nowrap}.opsbig{white-space:nowrap}
.opsw .cut{display:inline-flex}
.opsw .cut i{font-style:normal;display:inline-block;overflow:hidden;max-width:1em;white-space:pre}
.opsw.done .cut i{max-width:0;opacity:0}
.opsw.go .cut i{animation:cutl .55s ease forwards;animation-delay:calc(1.6s + var(--d))}
@keyframes cutl{0%{max-width:1em;opacity:1;transform:none}35%{transform:translateY(-4px) rotate(-10deg)}100%{max-width:0;opacity:0;transform:translateY(-8px)}}
.opsbig{font-size:clamp(22px,7vw,34px);font-weight:800;letter-spacing:-.5px;line-height:1.1}
.opscap{opacity:0;animation:fadein .8s ease forwards;animation-delay:3.4s;margin-top:6px;font-size:14px}
@keyframes fadein{to{opacity:.95}}
@media (prefers-reduced-motion:reduce){.opsw.go .cut i{animation-duration:.01s;animation-delay:0s}.opscap{animation-delay:0s}}
.top>div{overflow:hidden}.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top img.school{border-radius:50%}
.foot{max-width:1100px;margin:26px auto 30px;padding:0 14px;text-align:center;font-size:12px;line-height:1.55;color:var(--muted,#5b6b60)}
body.screenmode .foot{display:none}
.chip{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px}
.chip:hover{background:rgba(255,255,255,.22)}
.ribbon{background:#FFF3CD;color:#6B4E00;font-size:12px;text-align:center;padding:4px 10px;border-bottom:1px solid #F0DC9A}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line)}
.nav a{white-space:nowrap;text-decoration:none;color:var(--ink2);padding:6px 12px;border-radius:999px;font-size:13.5px;border:1px solid transparent}
.nav a.on{background:var(--green3);color:var(--green);border-color:#BFE0C3;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:14px}
h2{font-size:19px;margin:2px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--ink2);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--green2);color:#fff;min-height:44px}
.btn:hover{background:var(--green)}
.btn.alt{background:#fff;color:var(--green);border:1.5px solid var(--green2)}
.btn.grey{background:#ECEFEC;color:var(--ink)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:9px}
.btn.big{padding:16px 20px;font-size:17px;border-radius:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:12.5px;color:var(--ink2);margin:8px 0 3px}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid #A5D6A7;border-color:var(--green2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:11px 8px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600}
.seg button.on{color:#fff;border-color:transparent}
.seg button.on.wet{background:var(--wet)} .seg button.on.dry{background:var(--dry)} .seg button.on.mixed{background:var(--mixed)}
.seg button.on.good{background:var(--good)} .seg button.on.partly{background:var(--warn);color:#3b2e00} .seg button.on.poor{background:var(--bad)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:#ECEFEC;color:var(--ink2)}
.tag.good{background:#DFF2E1;color:#1B5E20}.tag.partly{background:#FFF1C2;color:#7A5900}.tag.poor{background:#FBDADA;color:#8E1B1B}
.tag.wet{background:#DFF2E1;color:#1B5E20}.tag.dry{background:#DCEFFB;color:#014E7B}.tag.mixed{background:#E7ECEF;color:#37474F}
.tag.run{background:#DFF2E1;color:#1B5E20}.tag.tomrf{background:#DCEFFB;color:#014E7B}.tag.done{background:#ECEFEC}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink2);font-weight:600;background:#F7FAF7;position:sticky;top:0}
.scroll{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.kpi{padding:12px 14px;border-radius:var(--r);background:#fff;border:1px solid var(--line)}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.kpi .l{font-size:12px;color:var(--ink2);margin-top:2px}
.map{height:340px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#E3EAE4}
.map.tall{height:460px}
.bar{height:10px;border-radius:999px;background:#E4EAE5;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green2);border-radius:999px;transition:width .6s}
.status{border-radius:var(--r);padding:16px;color:#fff;background:linear-gradient(135deg,#2E7D32,#1B5E20)}
.status.wait{background:linear-gradient(135deg,#546E7A,#37474F)}
.status.near{background:linear-gradient(135deg,#F9A825,#E08A00);color:#2d2100}
.status.done{background:linear-gradient(135deg,#0277BD,#014E7B)}
.status .big{font-size:30px;font-weight:800;line-height:1.1}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qrc{text-align:center;border:2px solid var(--line);border-radius:12px;padding:10px}
.qrc img{width:100%;max-width:170px;image-rendering:pixelated}
.qrc.wet{border-color:var(--wet)} .qrc.dry{border-color:var(--dry)}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--green2) calc(var(--p)*1%),#E4EAE5 0);display:grid;place-items:center;flex:none}
.ring b{background:#fff;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:21px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17231A;color:#fff;border-radius:12px;padding:11px 16px;z-index:3000;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px}
.toast.err{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(10,25,14,.55);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.hero{display:grid;gap:12px}
.role{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.role:hover{border-color:var(--green2)}
.role .ic{font-size:30px;width:52px;height:52px;border-radius:14px;background:var(--green3);display:grid;place-items:center;flex:none}
.role b{display:block;font-size:16px}
.stops li{list-style:none;display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.stops .no{width:26px;height:26px;border-radius:50%;background:var(--green3);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.stops li.done .no{background:var(--green2);color:#fff}
.stops li.cur .no{background:var(--warn);color:#3b2e00}
.feed li{list-style:none;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.mk{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.truck{font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));transform:translate(-4px,-4px)}
.leaflet-container{font-family:inherit;isolation:isolate;z-index:0}
/* command screen */
body.screenmode{background:#0C1A10;color:#EAF3EC}
body.screenmode .top,body.screenmode .nav,body.screenmode .ribbon{display:none}
body.screenmode main{max-width:none;padding:0}
.scr{display:grid;grid-template-columns:1.55fr 1fr;grid-template-rows:auto 1fr auto;height:100vh;gap:12px;padding:14px}
.scr .hd{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.scr .hd img{width:46px;height:46px;border-radius:10px;background:#fff}
.scr .hd h1{font-size:26px;letter-spacing:-.3px}
.scr .live{display:flex;align-items:center;gap:6px;font-weight:700;color:#7CE08A}
.scr .live i{width:10px;height:10px;border-radius:50%;background:#7CE08A;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.scr .map{height:100%;min-height:0;border:1px solid #234;}
.scr .side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.scr .kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scr .kpi{background:#132A1A;border-color:#24422D}
.scr .kpi .n{font-size:34px;color:#fff} .scr .kpi .l{color:#9DB8A3;font-size:13px}
.scr .pnl{background:#132A1A;border:1px solid #24422D;border-radius:var(--r);padding:12px}
.scr .pnl h3{color:#9DB8A3;font-size:13px;text-transform:uppercase;letter-spacing:.8px}
.scr .tk{padding:8px 0;border-bottom:1px solid #24422D}
.scr .tk b{font-size:17px}
.scr .bar{background:#24422D}.scr .bar>i{background:#7CE08A}
.scr .tick{grid-column:1/-1;background:#132A1A;border:1px solid #24422D;border-radius:var(--r);padding:10px 14px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr .al{padding:6px 0;color:#FFD27D;font-size:14px}
.scr .leaflet-container{background:#0f2315}
.scr .muted{color:#9DB8A3}
/* print */
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .tagcard{break-inside:avoid;border:2px solid #000;border-radius:10px;padding:10px;margin:0 0 12px;display:flex;gap:14px;align-items:center}
  .tagcard img{width:34mm;height:34mm}
  .poster{text-align:center;padding:20mm}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;font-size:10pt;margin:0 0 8px}.brand img{width:16mm;height:16mm;border-radius:50%}
  .foot{display:none}
  .poster img{width:90mm}
  .pb{break-after:page}
}
.tagcard{display:flex;gap:14px;align-items:center}
@media(max-width:700px){
  .scr{grid-template-columns:1fr;height:auto}
  .scr .map{height:320px}
}
</style>
</head>
<body>
<div class="top"></div>
<div id="ribbon" class="ribbon hide"></div>
<nav class="nav" id="nav"></nav>
<main id="view"></main>
<footer id="foot" class="foot"></footer>
<div id="modalRoot"></div>
<div id="printArea"></div>
<script src="leaflet.js"></script>
<script src="qrcode.js"></script>
<script src="html5-qrcode.min.js"></script>
<script>
/* =====================================================================
   WasteWise Ops: front end. Third app of WasteWise Daporijo.
   Roles: citizen (no login), driver, mrf, incharge, admin. All data comes from the
   Google Sheet through the Apps Script web app (Code.gs). Real places, routes and
   households are fed in Admin; nothing is hard-coded here.
   ===================================================================== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyAdddasjKly-FWSnodNiXI1YI9XJ6Rx3g7eMdkRM6Uek2Q8yvPeLolMKMT96Bk_O0o/exec';
const SURVEY_APPS = [
  { en: 'Survey app 1: households, shops, hostel, dump sites', hi: 'सर्वे ऐप 1: घर, दुकान, हॉस्टल, कचरा स्थल', url: 'https://nikhil509.github.io/wastewise-daporijo/' },
  { en: 'Survey app 2: road and premises survey', hi: 'सर्वे ऐप 2: सड़क और परिसर सर्वे', url: 'https://nikhil509.github.io/dapo100-survey/' },
];

const SCHOOL = {
  name: 'Vivekananda Public School', place: 'Daporijo, Upper Subansiri, Arunachal Pradesh',
  cbse: 'CBSE Affiliation No. 2230086 · School Code 35085',
  event: "National Children's Science Congress 2026–27", theme: 'Sub-theme R5: Waste Management',
  title: 'Project on Solid Waste Segregation (WasteWise Daporijo)',
  team: 'Yumgam Sorum Tamin · David Pakri Nirin (Class 9)', guide: 'Nikhil Anil',
};
const S = { st: null, token: null, role: null, name: null, live: null, paths: {}, timers: [], maps: {}, view: null, hh: null, gen: 0, anims: [] };
try { S.token = sessionStorage.getItem('ww_tok'); S.role = sessionStorage.getItem('ww_role'); S.name = sessionStorage.getItem('ww_name'); } catch (e) {}
let LANG = 'mix';
try { LANG = localStorage.getItem('ww_lang') || 'mix'; } catch (e) {}

/* ---------- small helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function T(en, hi) { return LANG === 'en' ? en : LANG === 'hi' ? hi : en + ' · ' + hi; }
const num = (v, d) => { const n = Number(v); return isFinite(n) ? n : (d || 0); };
const f1 = n => (Math.round(num(n) * 10) / 10).toFixed(1);
const rs = n => '₹' + Math.round(num(n)).toLocaleString('en-IN');
const fmtT = ms => ms ? new Date(ms).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }) : '';
const fmtD = ms => ms ? new Date(ms).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) : '';
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 5200 : 2600);
}
function setTimer(fn, ms) { const g = S.gen; const id = setInterval(() => { if (g === S.gen) fn(); }, ms); S.timers.push(id); return id; }
function clearTimers() { S.timers.forEach(clearInterval); S.timers = []; }
const PLACE = id => (S.st && S.st.places.find(p => p.PlaceID === id)) || null;
const ROUTE = id => (S.st && S.st.routes.find(r => r.RouteID === id)) || null;
const VEH = id => (S.st && S.st.vehicles.find(v => v.VehicleID === id)) || null;
const SERVICE = ['Pickup Point', 'Public Bin', 'Dump Site', 'Market', 'Landmark'];
function ids(route) { return String(route.StopPlaceIDs || '').split(',').map(s => s.trim()).filter(Boolean); }

/* ---------- backend calls ---------- */
let cbN = 0;
function api(action, params, opt) {
  params = params || {}; opt = opt || {};
  return new Promise((resolve, reject) => {
    if (WEB_APP_URL.indexOf('PASTE_YOUR') >= 0) return reject(new Error('The backend URL is not set yet (see README).'));
    const cb = 'wwcb' + (++cbN) + Date.now().toString(36);
    const q = new URLSearchParams(Object.assign({ action, callback: cb }, S.token ? { token: S.token } : {}, params));
    const s = document.createElement('script');
    const t = setTimeout(() => { done(); reject(new Error('The server is slow or offline.')); }, opt.timeout || 20000);
    function done() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => {
      done();
      if (d && d.status === 'error') {
        if (/log in again/i.test(d.message)) { logout(true); }
        reject(new Error(d.message));
      } else resolve(d);
    };
    s.onerror = () => { done(); reject(new Error('Network error.')); };
    s.src = WEB_APP_URL + '?' + q.toString();
    document.head.appendChild(s);
  });
}
function post(action, payload) {
  return fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ action, token: S.token }, payload)) });
}
async function loadStatic() { S.st = await api('static'); S.paths = {}; applyConfig(); return S.st; }
function applyConfig() {
  const r = $('#ribbon');
  if (S.st && S.st.config.DemoMode) { r.classList.remove('hide'); r.textContent = T('Demo mode: sample trips and weights are simulated. Roads, places and dump sites are real.', 'डेमो मोड: ट्रिप और वज़न नमूना हैं। सड़कें, स्थान और कचरा स्थल असली हैं।'); }
  else r.classList.add('hide');
}

/* ---------- login ---------- */
function logout(silent) {
  S.token = S.role = S.name = null; S.guest = false;
  try { sessionStorage.clear(); localStorage.removeItem('ww_hh'); } catch (e) {}
  renderHeader();
  if (!silent) { if (location.hash && location.hash !== '#/') location.hash = '#/'; else route(); }
}
const ROLE_LABEL = { driver: ['Driver', 'चालक'], mrf: ['MRF operator', 'एमआरएफ ऑपरेटर'], incharge: ['District in-charge', 'ज़िला प्रभारी'], admin: ['Admin', 'एडमिन'] };
function needLogin(roles) {
  if (S.token && (roles.indexOf(S.role) >= 0)) return Promise.resolve(true);
  return new Promise(resolve => {
    const opts = roles.map(r => `<option value="${r}">${esc(T(ROLE_LABEL[r][0], ROLE_LABEL[r][1]))}</option>`).join('');
    const m = modal(`<h3>${esc(T('Staff login', 'स्टाफ लॉगिन'))}</h3>
      <label class="f">${esc(T('Role', 'भूमिका'))}</label><select class="i" id="lgRole">${opts}</select>
      <label class="f">${esc(T('Passcode', 'पासकोड'))}</label><input class="i" id="lgCode" type="password" inputmode="numeric" autocomplete="off">
      <div class="row" style="margin-top:14px"><button class="btn" id="lgGo">${esc(T('Log in', 'लॉगिन'))}</button><button class="btn grey" id="lgNo">${esc(T('Cancel', 'रद्द करें'))}</button></div>
      <p class="muted" id="lgMsg" style="margin-top:8px"></p>`);
    const go = async () => {
      try {

/* ---------- geometry ---------- */
function hav(a, b, c, d) {
  const R = 6371000, p = Math.PI / 180, dl = (c - a) * p, dg = (d - b) * p;
  const x = Math.sin(dl / 2) ** 2 + Math.cos(a * p) * Math.cos(c * p) * Math.sin(dg / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function densify(pts, step) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], d = hav(a[0], a[1], b[0], b[1]), n = Math.max(1, Math.ceil(d / step));
    for (let k = 1; k <= n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
  }
  return out;
}
function nearestIdx(pts, lat, lng, from) {
  let bi = from || 0, bd = Infinity;
  for (let i = from || 0; i < pts.length; i++) { const d = hav(pts[i][0], pts[i][1], lat, lng); if (d < bd) { bd = d; bi = i; } }
  return bi;
}
/* A route as one smooth path with cumulative metres and the index of each stop on it. */
async function getPath(routeId) {
  if (S.paths[routeId]) return S.paths[routeId];
  const r = ROUTE(routeId); if (!r) return null;
  const stops = ids(r).map(PLACE).filter(Boolean);
  if (stops.length < 2) return null;
  let geo = [];
  try { const d = await api('route', { id: routeId }); geo = d.geometry || []; } catch (e) {}
  let pts = geo.length > 1 ? geo : stops.map(p => [num(p.Lat), num(p.Lng)]);
  pts = densify(pts, 20);
  if (pts.length > 6000) pts = pts.filter((_, i) => i % Math.ceil(pts.length / 6000) === 0);
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + hav(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]));
  let prev = 0;
  const stopGi = stops.map((p, k) => {
    if (k === 0) { prev = 0; return 0; }
    if (k === stops.length - 1) { prev = pts.length - 1; return prev; }
    const g = nearestIdx(pts, num(p.Lat), num(p.Lng), prev); prev = g; return g;
  });
  return (S.paths[routeId] = { pts, cum, stopGi, stops, total: cum[cum.length - 1], real: geo.length > 1 });
}
function fmtEta(sec) {
  if (sec < 20) return T('now', 'अभी');
  if (sec < 100) return Math.round(sec) + T(' sec', ' सेकंड');
  return Math.round(sec / 60) + T(' min', ' मिनट');
}


/* ---------- smooth truck animation (used by every role) ---------- */
function bearing(a, b) { const p = Math.PI / 180, dl = (b[1] - a[1]) * p * Math.cos(a[0] * p), dg = (b[0] - a[0]) * p; return (Math.atan2(dl, dg) / p + 360) % 360; }
function truckIconHtml(label) {

}
function truckLayer(map, opts) {
  opts = opts || {};

  const api_ = { items, map };
  const nameOf = t => (VEH(t.VehicleID) || {}).Name || t.TripID;
  function posAt(path, d) {
    const cum = path.cum, pts = path.pts, n = pts.length;

    let lo = 0, hi = n - 1; while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid; }
    const f = (d - cum[lo]) / ((cum[hi] - cum[lo]) || 1), a = pts[lo], b = pts[hi];
    return { ll: [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f], i: lo };
  }
  function setHeading(it, deg) {
    let diff = ((deg - it.hd + 540) % 360) - 180; it.hd = (it.hd + diff * 0.18 + 360) % 360;

      if (g !== S.gen || dead) return;
      have.add(t.TripID);
      let it = items[t.TripID];
      const loc = t.loc, now = performance.now();
      const tgt = path ? (loc.dist != null ? loc.dist : path.cum[Math.max(0, Math.min(Number(loc.gi) >= 0 ? Number(loc.gi) : 0, path.cum.length - 1))]) : 0;
      if (!it) {
        const p0 = path ? posAt(path, tgt) : { ll: [loc.lat, loc.lng], i: 0 };
        const mk = L.marker(p0.ll, { icon: L.divIcon({ className: '', html: truckIconHtml(opts.label !== false), iconSize: [46, 46], iconAnchor: [23, 23] }), zIndexOffset: 1000, keyboard: false }).addTo(map);
        mk.bindTooltip(nameOf(t), { direction: 'top', offset: [0, -22] });
        const el = mk.getElement();
        it = items[t.TripID] = { id: t.TripID, path, dist: tgt, tgt, spd: 0, ping: now, mk, el, body: el && el.querySelector('.tkb'), lbl: el && el.querySelector('.tkl'), hd: path ? bearing(posAt(path, Math.max(0, tgt - 8)).ll, posAt(path, tgt + 8).ll) : 0, trail: null, lastTrail: 0, ll: p0.ll };

}

async function citizenStatus(d, live) {
  const h = d.household;
  const trip = live.active.find(t => t.Status === 'Running' && d.routes.indexOf(t.RouteID) >= 0);
  if (!trip) {
    const justDone = d.last && d.last.length && (Date.now() - d.last[0].Time) < 6 * 3600 * 1000;
    if (justDone) return { kind: 'done', small: T('Latest pickup', 'पिछला पिकअप'), big: T('Picked up ✔', 'उठाया गया ✔'), line: T('Thank you for separating your waste.', 'कचरा अलग करने के लिए धन्यवाद।') };
    return { kind: 'wait', small: T('Truck status', 'ट्रक की स्थिति'), big: T('No truck on the road now', 'अभी कोई ट्रक सड़क पर नहीं'), line: T('Keep wet and dry waste in two bags. You will be told when the truck starts.', 'गीला और सूखा कचरा दो बैग में रखें। ट्रक चलते ही बताया जाएगा।') };
  }
  const path = await getPath(trip.RouteID);
  const k = path.stops.findIndex(p => p.PlaceID === h.PlaceID);
  const stopGi = path.stopGi[k];
  const picked = trip.done.indexOf(h.PlaceID + '|' + h.HouseholdID) >= 0;
  const loc = trip.loc;
  const gi = loc ? (loc.gi >= 0 ? loc.gi : nearestIdx(path.pts, loc.lat, loc.lng, 0)) : 0;
  const veh = VEH(trip.VehicleID);
  const skipped = (live.alerts || []).find(a => a.Type === 'Missed stop' && a.PlaceID === h.PlaceID && a.Time >= trip.StartTime);
  if (!picked && skipped) return { kind: 'passed', small: T('Truck ', 'ट्रक ') + (veh ? veh.Name : ''), big: T('Your stop was skipped', 'आपका पड़ाव छोड़ा गया'), line: skipped.Message + ' ' + T('Use "Report a problem" if you were ready.', 'अगर आप तैयार थे तो "समस्या बताएँ" दबाएँ।'), trip };
  if (picked) return { kind: 'done', small: T('Truck ', 'ट्रक ') + (veh ? veh.Name : ''), big: T('Picked up ✔', 'उठाया गया ✔'), line: T('Your bags were collected and weighed.', 'आपके बैग उठाए और तौले गए।'), trip };
  const dist = path.cum[stopGi] - path.cum[Math.min(gi, path.cum.length - 1)];
  const spd = loc && loc.spd > 0.5 ? loc.spd : num(S.st.config.AvgSpeedKmh, 20) / 3.6;
  if (dist <= 40 && gi <= stopGi + 2) return { kind: 'here', small: T('Truck ', 'ट्रक ') + (veh ? veh.Name : ''), big: T('The truck is at your stop', 'ट्रक आपके पिकअप पॉइंट पर है'), line: T('Show your QR bag tag to the driver.', 'ड्राइवर को अपना QR बैग टैग दिखाएँ।'), trip, pct: 100 };
  if (dist < -40) return { kind: 'passed', small: T('Truck ', 'ट्रक ') + (veh ? veh.Name : ''), big: T('The truck has passed your stop', 'ट्रक आपके पॉइंट से निकल गया'), line: T('Your bags were not scanned. Keep them ready for the next trip.', 'आपके बैग स्कैन नहीं हुए। अगली बार तैयार रखें।'), trip };
  const sec = dist / spd;
  const total = Math.max(1, path.cum[stopGi]);
  const pct = Math.max(2, Math.min(98, Math.round(100 * (1 - dist / total))));
  return { kind: sec < 120 ? 'near' : 'coming', small: T('Truck ', 'ट्रक ') + (veh ? veh.Name : '') + ' · ' + (ROUTE(trip.RouteID) ? ROUTE(trip.RouteID).Name : ''), big: T('Truck arrives in ', 'ट्रक पहुँचेगा ') + fmtEta(sec), line: Math.round(dist) + T(' m away', ' मीटर दूर'), pct, trip, gi };
}

  v.innerHTML = `<div class="grid g2">
    <div class="card"><h2>${esc(T('Start a trip', 'ट्रिप शुरू करें'))}</h2>
      <label class="f">${esc(T('Vehicle', 'वाहन'))}</label><select class="i" id="dVeh">${vehs.map(x => `<option value="${esc(x.VehicleID)}">${esc(x.Name)} (${esc(x.Type)})</option>`).join('')}</select>
      <label class="f">${esc(T('Route', 'रास्ता'))}</label><select class="i" id="dRoute">${routes.map(r => `<option value="${esc(r.RouteID)}">${esc(r.Name)}${r.DistanceKm ? ' · ' + r.DistanceKm + ' km' : ''}</option>`).join('')}</select>
      <div class="row" style="margin-top:14px"><button class="btn big" id="dStart">${esc(T('Start trip', 'ट्रिप शुरू करें'))}</button></div>
      <p class="muted" id="dMsg" style="margin-top:8px"></p></div>
    <div class="card"><h2>${esc(T('Trips on the road', 'सड़क पर चल रही ट्रिप'))}</h2>
      ${running.length ? running.map(t => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${esc(t.TripID)}</b> · ${esc((ROUTE(t.RouteID) || {}).Name || t.RouteID)}<div class="muted">${esc((VEH(t.VehicleID) || {}).Name || '')} · ${f1(t.kg)} kg · ${t.pickups} ${esc(T('pickups', 'पिकअप'))}</div></div><div class="sp"></div><button class="btn alt sm" data-resume="${esc(t.TripID)}">${esc(T('Resume', 'जारी रखें'))}</button></div>`).join('') : `<p class="muted">${esc(T('No trip is running.', 'कोई ट्रिप नहीं चल रही।'))}</p>`}
    </div></div>`;
  const syncRoute = () => { const x = VEH($('#dVeh').value); if (x && x.RouteID) $('#dRoute').value = x.RouteID; };
  $('#dVeh').onchange = syncRoute; syncRoute();
  $('#dStart').onclick = async () => {
    try { const d = await api('startTrip', { routeId: $('#dRoute').value, vehicleId: $('#dVeh').value }); await driverTrip(v, d.trip); }
    catch (e) { $('#dMsg').textContent = e.message; }
  };
  $$('[data-resume]').forEach(b => b.onclick = async () => {
    const t = running.find(x => x.TripID === b.dataset.resume);
    try { await driverTrip(v, { TripID: t.TripID, RouteID: t.RouteID, VehicleID: t.VehicleID, Status: 'Running' }, t.loc); } catch (e) { toast(e.message, true); }
  });
};

function parseTag(text) {
  const m = String(text || '').trim().match(/^WW\|([A-Za-z0-9-]+)\|(Wet|Dry)$/i);
  return m ? { hh: m[1].toUpperCase(), stream: m[2][0].toUpperCase() + m[2].slice(1).toLowerCase() } : null;
}
function scanQR(onText) {
  const m = modal(`<h3>${esc(T('Scan the bag QR tag', 'बैग का QR टैग स्कैन करें'))}</h3><div id="qrReader" style="width:100%;min-height:240px;background:#000;border-radius:12px"></div><p class="muted" id="qrMsg" style="margin-top:8px"></p><div class="row" style="margin-top:10px"><button class="btn grey" id="qrNo">${esc(T('Close', 'बंद करें'))}</button></div>`);
  let sc = null, finished = false;
  const stop = async () => { try { if (sc) { await sc.stop(); sc.clear(); } } catch (e) {} sc = null; };
  stopScanner = stop;
  $('#qrNo').onclick = async () => { finished = true; await stop(); m.close(); };
  m.onclose = stop;
  if (!window.Html5Qrcode) { $('#qrMsg').textContent = T('Scanner not available. Enter the ID by hand.', 'स्कैनर उपलब्ध नहीं। ID हाथ से लिखें।'); return; }
  sc = new Html5Qrcode('qrReader', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], useBarCodeDetectorIfSupported: true, verbose: false });
  sc.start({ facingMode: 'environment' }, { fps: 12 }, async txt => {
    if (finished) return; const t = parseTag(txt);
    if (!t) { $('#qrMsg').textContent = T('That is not a WasteWise tag.', 'यह वेस्टवाइज टैग नहीं है।'); return; }
    finished = true; await stop(); m.close(); onText(t);
  }, () => {}).catch(() => { $('#qrMsg').textContent = T('Camera not available. Use "Enter by hand".', 'कैमरा उपलब्ध नहीं। "हाथ से लिखें" चुनें।'); });
}

async function driverTrip(v, trip, loc0) {
  const path = await getPath(trip.RouteID);
  if (!path) throw new Error('This route has fewer than two stops.');
  let pk = []; try { pk = (await api('tripPickups', { id: trip.TripID })).pickups; } catch (e) {}
  const D = { trip, path, dist: 0, gi: 0, k: 0, mode: 'demo', f: 6, moving: false, arrived: true, done: new Set(), pk, spd: 0, timer: null, ended: false };
  if (loc0 && loc0.gi >= 0) { D.gi = loc0.gi; D.dist = path.cum[D.gi]; D.k = Math.max(0, path.stopGi.filter(g => g <= D.gi).length - 1); }
  pk.forEach(x => D.done.add(x.PlaceID));
  const stops = path.stops, last = stops.length - 1;
  const route = ROUTE(trip.RouteID) || { Name: trip.RouteID };
  const isService = i => i > 0 && i < last;
  const nextTarget = () => { for (let i = D.k + 1; i < last; i++) { if (!D.done.has(stops[i].PlaceID)) return i; } return last; };

  v.innerHTML = `<div class="grid g2">
    <div class="grid" style="align-content:start">
      <div class="card"><div class="row"><div><h2 style="margin:0">${esc(route.Name)}</h2><div class="muted">${esc(trip.TripID)} · ${esc((VEH(trip.VehicleID) || {}).Name || '')}</div></div><div class="sp"></div><div style="text-align:right"><div style="font-size:24px;font-weight:800" id="dKg">0.0 kg</div><div class="muted" id="dCnt"></div></div></div>
        <div class="bar" style="margin-top:10px"><i id="dBar" style="width:0%"></i></div></div>
      <div class="card" id="dNext"></div>
      <div class="card"><h3>${esc(T('Stops', 'पड़ाव'))}</h3><ul class="stops" id="dStops"></ul></div>
      <div class="card"><h3>${esc(T('This trip', 'यह ट्रिप'))}</h3><div class="scroll"><table><thead><tr><th>${esc(T('Time', 'समय'))}</th><th>ID</th><th>${esc(T('Type', 'प्रकार'))}</th><th>kg</th><th>${esc(T('Sorting', 'अलगाव'))}</th></tr></thead><tbody id="dPk"></tbody></table></div></div>
    </div>
    <div class="card"><div id="dMap" class="map tall"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn grey sm" id="bMute">${esc(T('Simulate lost signal (30 s)', 'सिग्नल जाना दिखाएँ (30 सेकंड)'))}</button>
        <div class="seg" style="max-width:260px"><button id="mDemo" class="on good">${esc(T('Demo drive', 'डेमो ड्राइव'))}</button><button id="mGps">${esc(T('Real GPS', 'असली GPS'))}</button></div>
        <label class="muted" id="fWrap">${esc(T('Demo speed', 'डेमो गति'))} <select id="dF" class="i" style="width:auto;min-height:34px;padding:4px 8px"><option value="3">×3</option><option value="6" selected>×6</option><option value="12">×12</option><option value="25">×25</option></select></label>
      </div></div></div>`;

  const m = makeMap($('#dMap'), { zoom: 16 }); S.maps.dMap = m;
  let tm = null;
  if (m) {
    L.polyline(path.pts, { color: '#1E88E5', weight: 5, opacity: .75 }).addTo(m);
    stops.forEach((p, i) => placeMarker(p, isService(i) ? i : null).addTo(m));
    tm = truckLayer(m, { trail: true, follow: true, local: true });
    m.fitBounds(L.polyline(path.pts).getBounds().pad(.2));
  }
  const pos = () => path.pts[Math.min(D.gi, path.pts.length - 1)];
  function moveTruck() { if (tm) { const p = pos(); tm.sync([{ TripID: trip.TripID, VehicleID: trip.VehicleID, RouteID: trip.RouteID, loc: { lat: p[0], lng: p[1], gi: D.gi, dist: D.dist, spd: D.moving ? D.spd : 0 } }]); } }

  function renderStops() {
    $('#dStops').innerHTML = stops.map((p, i) => {
      const cls = D.done.has(p.PlaceID) ? 'done' : (i === (D.moving ? D.target : nextTarget()) ? 'cur' : '');
      const tag = i === 0 ? '🏭' : i === last ? '♻️' : i;
      return `<li class="${cls}"><span class="no">${tag}</span><div><b>${esc(p.Name)}</b><div class="muted">${esc(p.Type)}${p.Colony ? ' · ' + esc(p.Colony) : ''}</div></div></li>`;
    }).join('');
  }
  function renderPk() {
    const kg = D.pk.reduce((s, x) => s + num(x.WeightKg), 0);
    $('#dKg').textContent = f1(kg) + ' kg'; $('#dCnt').textContent = D.pk.length + ' ' + T('pickups', 'पिकअप');
    const svc = stops.filter((_, i) => isService(i)).length;
    const dn = stops.filter((p, i) => isService(i) && D.done.has(p.PlaceID)).length;
    $('#dBar').style.width = (svc ? Math.round(100 * dn / svc) : 0) + '%';
    $('#dPk').innerHTML = D.pk.slice().reverse().map(x => `<tr><td>${fmtT(x.Time)}</td><td>${esc(x.HouseholdID || '—')}</td><td><span class="tag ${String(x.Stream).toLowerCase()}">${esc(x.Stream)}</span></td><td>${f1(x.WeightKg)}</td><td><span class="tag ${String(x.Segregation).toLowerCase()}">${esc(x.Segregation)}</span></td></tr>`).join('') || `<tr><td colspan="5" class="muted">${esc(T('No pickups yet.', 'अभी कोई पिकअप नहीं।'))}</td></tr>`;
  }
  function renderNext() {
    const el = $('#dNext'); renderStops(); renderPk();
    if (D.ended) { el.innerHTML = `<h3>${esc(T('Trip ended', 'ट्रिप समाप्त'))}</h3><p>${esc(T('The load is waiting at the MRF.', 'माल एमआरएफ में रिसीव होने की प्रतीक्षा में है।'))}</p><div class="row"><button class="btn" onclick="route()">${esc(T('Back', 'वापस'))}</button></div>`; return; }
    if (D.moving) {
      const t = stops[D.target];
      const remain = Math.max(0, Math.round(path.cum[path.stopGi[D.target]] - D.dist));
      el.innerHTML = `<div class="muted">${esc(T('Driving to', 'जा रहे हैं'))}</div><h2 style="margin:0">${esc(t.Name)}</h2><div style="font-size:26px;font-weight:800;margin:6px 0">${remain} m</div>${D.mode === 'gps' ? `<button class="btn alt" id="bArr">${esc(T('I have arrived', 'मैं पहुँच गया'))}</button>` : ''}`;
      if ($('#bArr')) $('#bArr').onclick = arrive; return;
    }
    const cur = stops[D.k];
    if (D.k === last) {
      el.innerHTML = `<div class="muted">${esc(T('At the MRF', 'एमआरएफ पर'))}</div><h2 style="margin:0">${esc(cur.Name)}</h2><p>${esc(T('Hand over the load and end the trip. The MRF will weigh and sort it.', 'माल सौंपकर ट्रिप समाप्त करें। एमआरएफ तौलकर छाँटेगा।'))}</p><button class="btn big" id="bEnd">${esc(T('Hand over and end trip', 'माल सौंपें और ट्रिप खत्म करें'))}</button>`;
      $('#bEnd').onclick = endTrip; return;
    }
    if (D.k === 0 && !D.pk.length && !D.done.size) {
      const t = stops[nextTarget()];
      el.innerHTML = `<div class="muted">${esc(T('At the depot', 'डिपो पर'))}</div><h2 style="margin:0">${esc(T('Ready to go', 'चलने को तैयार'))}</h2><p>${esc(T('First stop: ', 'पहला पड़ाव: '))}<b>${esc(t.Name)}</b></p><button class="btn big" id="bGo">${esc(T('Drive to first stop', 'पहले पड़ाव पर चलें'))}</button>`;
      $('#bGo').onclick = startDrive; return;
    }
    const nt = nextTarget();
    el.innerHTML = `<div class="muted">${esc(T('Arrived at', 'पहुँच गए'))}</div><h2 style="margin:0">${esc(cur.Name)}</h2>
      <div class="row" style="margin:12px 0"><button class="btn big" id="bScan">📷 ${esc(T('Scan bag', 'बैग स्कैन करें'))}</button><button class="btn alt big" id="bMan">⌨️ ${esc(T('Enter by hand', 'हाथ से लिखें'))}</button></div>
      <div class="row"><button class="btn grey" id="bNext">${esc(nt === last ? T('Done here · drive to MRF', 'यहाँ पूरा · एमआरएफ चलें') : T('Done here · next stop', 'यहाँ पूरा · अगला पड़ाव'))}</button>${D.k > 0 && D.k < last ? `<button class="btn bad sm" id="bSkip">${esc(T('Skip this stop', 'यह पड़ाव छोड़ें'))}</button>` : ''}</div>`;
    $('#bScan').onclick = () => scanQR(t => pickupForm(t.hh, t.stream));
    $('#bMan').onclick = () => pickupForm('', 'Wet');
    $('#bNext').onclick = () => { D.done.add(cur.PlaceID); startDrive(); };
    if ($('#bSkip')) $('#bSkip').onclick = async () => {
      const o = await editor(T('Skip this stop', 'यह पड़ाव छोड़ें'), [{ k: 'reason', label: T('Reason', 'कारण'), type: 'select', opts: [['Bags not ready', T('Bags not ready', 'बैग तैयार नहीं')], ['Road blocked', T('Road blocked', 'सड़क बंद')], ['Truck full', T('Truck full', 'ट्रक भरा')]] }], { reason: 'Bags not ready' });
      if (!o) return;
      try { await api('skip', { tripId: trip.TripID, placeId: cur.PlaceID, reason: o.reason }); D.done.add(cur.PlaceID); toast(T('Stop skipped. The in-charge and the citizen are told.', 'पड़ाव छोड़ा। प्रभारी और नागरिक को बताया गया।')); startDrive(); } catch (e) { toast(e.message, true); }
    };
  }

  function pickupForm(hh, stream) {
    const cur = stops[D.k];
    const st = { stream: stream || 'Wet', seg: 'Good' };
    const mm = modal(`<h3>${esc(cur.Name)}</h3>
      <label class="f">${esc(T('Household ID', 'घर की ID'))}</label><input class="i" id="pHH" value="${esc(hh)}" placeholder="HH-D03" autocapitalize="characters">
      <label class="f">${esc(T('Bag', 'बैग'))}</label><div class="seg" id="pStream"><button data-v="Wet" class="wet">${esc(T('Wet', 'गीला'))}</button><button data-v="Dry" class="dry">${esc(T('Dry', 'सूखा'))}</button><button data-v="Mixed" class="mixed">${esc(T('Mixed', 'मिला'))}</button></div>
      <label class="f">${esc(T('Weight (kg)', 'वज़न (किलो)'))}</label><input class="i" id="pKg" type="number" step="0.1" min="0" inputmode="decimal" placeholder="0.0">
      <label class="f">${esc(T('How well separated?', 'कितना अच्छा अलग किया?'))}</label><div class="seg" id="pSeg"><button data-v="Good" class="good">${esc(T('Good', 'अच्छा'))}</button><button data-v="Partly" class="partly">${esc(T('Partly', 'कुछ'))}</button><button data-v="Poor" class="poor">${esc(T('Poor', 'खराब'))}</button></div>
      <div class="row" style="margin-top:14px"><button class="btn" id="pSave">${esc(T('Save pickup', 'पिकअप सेव करें'))}</button><button class="btn grey" id="pNo">${esc(T('Cancel', 'रद्द करें'))}</button></div><p class="muted" id="pMsg"></p>`);
    const sync = () => { $$('#pStream button', mm.el).forEach(b => b.classList.toggle('on', b.dataset.v === st.stream)); $$('#pSeg button', mm.el).forEach(b => b.classList.toggle('on', b.dataset.v === st.seg)); };
    $$('#pStream button', mm.el).forEach(b => b.onclick = () => { st.stream = b.dataset.v; sync(); });
    $$('#pSeg button', mm.el).forEach(b => b.onclick = () => { st.seg = b.dataset.v; sync(); });
    sync(); setTimeout(() => $('#pKg') && $('#pKg').focus(), 80);
    $('#pNo').onclick = mm.close;
    $('#pSave').onclick = async () => {
      const btn = $('#pSave'); btn.disabled = true;
      try {
        const id = $('#pHH').value.trim().toUpperCase();
        const params = { tripId: trip.TripID, stream: st.stream, kg: $('#pKg').value, seg: st.seg };
        if (id) params.householdId = id; else params.placeId = cur.PlaceID;
        const d = await api('pickup', params);
        D.pk.push(d.pickup); D.done.add(d.pickup.PlaceID || cur.PlaceID);
        mm.close(); toast(`${T('Saved', 'सेव हुआ')} · ${f1(d.pickup.WeightKg)} kg ${d.pickup.Stream}${id ? ' · ' + id : ''}`);
        renderNext();
      } catch (e) { $('#pMsg').textContent = e.message; btn.disabled = false; }
    };
  }

  function arrive() {
    clearInterval(D.timer); D.moving = false; D.arrived = true; D.k = D.target; D.spd = 0;
    D.dist = path.cum[path.stopGi[D.k]]; D.gi = path.stopGi[D.k]; moveTruck(); pingNow(); renderNext();
    if (D.k !== last) toast(T('Arrived: ', 'पहुँच गए: ') + stops[D.k].Name);
  }
  function startDrive() {
    D.target = nextTarget(); D.moving = true; D.arrived = false; renderNext();
    clearInterval(D.timer);
    if (D.mode === 'demo') {
      D.timer = setInterval(() => {
        const tgi = path.stopGi[D.target];
        const base = (num(S.st.config.AvgSpeedKmh, 20) / 3.6) * D.f;
        const rem0 = path.cum[tgi] - D.dist;
        const wob = Math.max(0.3, 0.85 + 0.3 * Math.sin(D.dist / 70) + 0.15 * Math.sin(D.dist / 23));
        const spd = base * wob * Math.min(1, 0.3 + rem0 / 60);
        D.dist += spd * 0.5; D.spd = (D.spd || spd) * 0.8 + spd * 0.2;
        while (D.gi < tgi && path.cum[D.gi + 1] <= D.dist) D.gi++;
        moveTruck();
        if (D.gi >= tgi) { arrive(); return; }
        const rem = $('#dNext h2 + div'); if (rem) rem.textContent = Math.max(0, Math.round(path.cum[tgi] - D.dist)) + ' m';
      }, 500);
      S.timers.push(D.timer);
    }
  }
  let watch = null;
  function startGps() {
    if (!navigator.geolocation) { toast(T('GPS is not available.', 'GPS उपलब्ध नहीं।'), true); return; }
    watch = navigator.geolocation.watchPosition(p => {
      const lat = p.coords.latitude, lng = p.coords.longitude;
      D.gi = nearestIdx(path.pts, lat, lng, Math.max(0, D.gi - 5)); D.dist = path.cum[D.gi];
      D.spd = p.coords.speed > 0 ? p.coords.speed : num(S.st.config.AvgSpeedKmh, 20) / 3.6;
      moveTruck();
      if (D.moving && hav(lat, lng, num(stops[D.target].Lat), num(stops[D.target].Lng)) < 40) arrive();
    }, e => toast(T('GPS error: ', 'GPS त्रुटि: ') + e.message, true), { enableHighAccuracy: true, maximumAge: 2000 });
  }
  function pingNow() { if (D.mute && Date.now() < D.mute) return; const p = pos(); api('ping', { tripId: trip.TripID, lat: p[0], lng: p[1], gi: D.gi, spd: D.moving ? D.spd : 0 }, { timeout: 8000 }).catch(() => {}); }
  async function endTrip() {
    try { await api('endTrip', { tripId: trip.TripID }); D.ended = true; clearInterval(D.timer); if (watch != null) navigator.geolocation.clearWatch(watch); toast(T('Trip ended. Waiting at the MRF.', 'ट्रिप खत्म। एमआरएफ में प्रतीक्षा।')); renderNext(); }
    catch (e) { toast(e.message, true); }
  }
  $('#mDemo').onclick = () => { D.mode = 'demo'; $('#mDemo').classList.add('on', 'good'); $('#mGps').classList.remove('on', 'good'); $('#fWrap').classList.remove('hide'); if (watch != null) { navigator.geolocation.clearWatch(watch); watch = null; } };
  $('#mGps').onclick = () => { D.mode = 'gps'; $('#mGps').classList.add('on', 'good'); $('#mDemo').classList.remove('on', 'good'); $('#fWrap').classList.add('hide'); clearInterval(D.timer); if (D.moving) renderNext(); startGps(); };
  $('#bMute').onclick = () => { D.mute = Date.now() + 30000; toast(T('Pings paused for 30 seconds. Watch the in-charge screen.', '30 सेकंड के लिए पिंग बंद। प्रभारी स्क्रीन देखें।')); };
  $('#dF').onchange = e => { D.f = num(e.target.value, 6); };
  setTimer(pingNow, 2000);
  moveTruck(); renderNext(); pingNow();
}

  v.innerHTML = `<div class="card" style="margin-bottom:12px"><h3>${esc(T('Trucks on the road', 'सड़क पर ट्रक'))}</h3><div id="mMap" class="map"></div></div><div id="mBody"></div>`;

  async function draw() {

/* ============================ SHARED LIVE BOARD ============================ */
async function buildLiveBoard(el, dark) {
  const m = makeMap(el, { dark, zoom: 15 }); S.maps[el.id] = m;
  const board = { m, trucks: {}, binMk: {}, dumps: L.layerGroup() };
  const cols = ['#43A047', '#1E88E5', '#FB8C00', '#AB47BC', '#00ACC1'];
  const all = [], seen = new Set();
  let ci = 0;
  for (const r of S.st.routes) {
    const path = await getPath(r.RouteID); if (!path) continue;
    L.polyline(path.pts, { color: cols[ci++ % cols.length], weight: 4, opacity: .85 }).addTo(m).bindTooltip(r.Name);
    path.pts.forEach(p => all.push(p));
    path.stops.forEach((p, i) => { if (seen.has(p.PlaceID)) return; seen.add(p.PlaceID); placeMarker(p, null).addTo(m); });
  }
  S.st.places.filter(p => p.Type === 'Dump Site').forEach(p => {
    L.circleMarker([num(p.Lat), num(p.Lng)], { radius: 4, color: '#C62828', weight: 1, fillColor: '#EF5350', fillOpacity: .8 }).addTo(board.dumps).bindPopup(`<b>${esc(p.Name)}</b><br>${esc(p.Notes || '')}`);
  });
  board.dumps.addTo(m);
  if (all.length) m.fitBounds(L.latLngBounds(all).pad(.15));
  board.update = async live => {
    if (!board.tl) board.tl = truckLayer(m, { trail: true });
    await board.tl.sync(live.active.filter(t => t.loc));
    board.alertMk = board.alertMk || {};
    const seenA = new Set();
    (live.alerts || []).filter(a => a.Lat != null && /Missed|dump|Bin full/i.test(a.Type)).forEach(a => {
      seenA.add(a.AlertID);
      if (!board.alertMk[a.AlertID]) board.alertMk[a.AlertID] = L.marker([a.Lat, a.Lng], { icon: L.divIcon({ className: '', html: '<div class="mk" style="width:30px;height:30px;border-radius:50%;background:#C62828;font-size:16px;animation:pulse 1.4s infinite">!</div>', iconSize: [30, 30], iconAnchor: [15, 15] }), zIndexOffset: 800 }).addTo(m).bindTooltip(a.Type + ': ' + a.Message);
    });
    Object.keys(board.alertMk).forEach(k => { if (!seenA.has(k)) { m.removeLayer(board.alertMk[k]); delete board.alertMk[k]; } });
    live.bins.forEach(b => {
      const p = PLACE(b.PlaceID); if (!p) return;
      const col = b.FillPct >= 80 ? '#C62828' : b.FillPct >= 50 ? '#F9A825' : '#2E7D32';
      const ic = L.divIcon({ className: '', html: `<div class="mk" style="width:44px;height:24px;border-radius:12px;background:${col}">🗑 ${Math.round(b.FillPct)}%</div>`, iconSize: [44, 24], iconAnchor: [22, 34] });
      if (!board.binMk[b.BinID]) board.binMk[b.BinID] = L.marker([num(p.Lat), num(p.Lng)], { icon: ic, zIndexOffset: 500 }).addTo(m).bindTooltip(b.Name);
      else board.binMk[b.BinID].setIcon(ic);
    });
  };
  return board;
}

function kpiTiles(live, cls) {
  const t = live.today;
  const k = (n, l) => `<div class="kpi"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`;
  return k(f1(t.kg) + ' kg', T('collected today', 'आज उठाया')) +
    k(t.segGoodPct == null ? '–' : t.segGoodPct + '%', T('well separated', 'अच्छा अलग')) +
    k(rs(t.revenue), T('income from dry waste', 'सूखे कचरे से आमदनी')) +
    k(t.pickups + ' · ' + t.trips, T('pickups · trips', 'पिकअप · ट्रिप')) +
    (cls === 'full' ? k(f1(t.wetKg) + ' / ' + f1(t.dryKg), T('wet / dry kg', 'गीला / सूखा किलो')) + k(f1(t.rejectedKg) + ' kg', T('rejected at MRF', 'एमआरएफ में अस्वीकृत')) : '');
}

async function trucksHtml(live, dark) {
  if (!live.active.length) return `<p class="muted">${esc(T('No truck on the road.', 'सड़क पर कोई ट्रक नहीं।'))}</p>`;
  let out = '';
  for (const t of live.active) {
    const path = await getPath(t.RouteID);
    const gi = t.loc && t.loc.gi >= 0 ? t.loc.gi : 0;
    const pct = path ? Math.round(100 * path.cum[Math.min(gi, path.cum.length - 1)] / Math.max(1, path.total)) : 0;
    let eta = '';
    if (path && t.Status === 'Running') { const spd = t.loc && t.loc.spd > .5 ? t.loc.spd : num(S.st.config.AvgSpeedKmh, 20) / 3.6; eta = ' · ' + T('MRF in ', 'एमआरएफ ') + fmtEta((path.total - path.cum[Math.min(gi, path.cum.length - 1)]) / spd); }
    out += `<div class="tk" style="padding:8px 0;border-bottom:1px solid ${dark ? '#24422D' : 'var(--line)'}"><div class="row"><b>${esc((VEH(t.VehicleID) || {}).Name || t.TripID)}</b><span class="tag ${t.Status === 'Running' ? 'run' : 'tomrf'}">${esc(t.Status === 'Running' ? T('On route', 'रास्ते में') : T('At MRF', 'एमआरएफ पर'))}</span>${t.Status === 'Running' && t.loc && live.now - t.loc.t > 20000 ? `<span class="tag poor">⚠ ${esc(T('No signal ', 'सिग्नल नहीं '))}${Math.round((live.now - t.loc.t) / 1000)} s</span>` : ''}<div class="sp"></div><span>${f1(t.kg)} kg</span></div><div class="muted">${esc((ROUTE(t.RouteID) || {}).Name || t.RouteID)}${eta}</div><div class="bar" style="margin-top:5px"><i style="width:${pct}%"></i></div></div>`;
  }
  return out;
}

function chartDays(series, dark) {
  if (!series.length) return `<p class="muted">—</p>`;
  const W = 560, H = 190, pl = 34, pb = 26, pt = 10, bw = (W - pl - 6) / series.length;
  const max = Math.max(10, ...series.map(s => s.wet + s.dry));
  const ink = dark ? '#9DB8A3' : '#4A5A4E', grid = dark ? '#24422D' : '#DCE5DD';
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = pt + (H - pt - pb) * (1 - i / 4); g += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="${grid}"/><text x="${pl - 5}" y="${y + 4}" text-anchor="end" font-size="10" fill="${ink}">${Math.round(max * i / 4)}</text>`; }
  series.forEach((s, i) => {
    const x = pl + i * bw + bw * .18, w = bw * .64, hh = H - pt - pb;
    const hw = hh * s.wet / max, hd = hh * s.dry / max;
    g += `<rect x="${x}" y="${pt + hh - hw}" width="${w}" height="${hw}" fill="#2E7D32" rx="2"><title>${s.date}: wet ${s.wet} kg</title></rect>`;
    g += `<rect x="${x}" y="${pt + hh - hw - hd - 2}" width="${w}" height="${hd}" fill="#0288D1" rx="2"><title>${s.date}: dry ${s.dry} kg</title></rect>`;
    g += `<text x="${x + w / 2}" y="${H - 9}" text-anchor="middle" font-size="9.5" fill="${ink}">${s.date.slice(8)}/${s.date.slice(5, 7)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="kg per day">${g}</svg><div class="row muted" style="gap:14px"><span><i style="display:inline-block;width:10px;height:10px;background:#2E7D32;border-radius:2px"></i> ${esc(T('Wet', 'गीला'))}</span><span><i style="display:inline-block;width:10px;height:10px;background:#0288D1;border-radius:2px"></i> ${esc(T('Dry', 'सूखा'))}</span></div>`;
}

function feedHtml(live) {
  return live.recent.length ? live.recent.map(x => `<li>${fmtT(x.Time)} · <b>${esc(x.HouseholdID || x.Place)}</b> · <span class="tag ${x.Stream.toLowerCase()}">${esc(x.Stream)}</span> ${f1(x.WeightKg)} kg · <span class="tag ${x.Segregation.toLowerCase()}">${esc(x.Segregation)}</span></li>`).join('') : `<li class="muted">—</li>`;
}

    list(); form();
    if (r && r.hasGeometry) { try { const g = await api('route', { id: r.RouteID }); RB.plan = { geometry: g.geometry, distanceKm: r.DistanceKm, durationMin: r.DurationMin, saved: true, onRoad: true }; } catch (e) {} }

      <label class="f">${esc(T('Stops in order (first = depot, last = MRF)', 'पड़ाव क्रम से (पहला = डिपो, आख़िरी = एमआरएफ)'))}</label>

      <label class="row muted" style="margin-top:10px"><input type="checkbox" id="rOpt" checked> ${esc(T('Find the shortest order of the middle stops', 'बीच के पड़ावों का सबसे छोटा क्रम खोजें'))}</label>
      <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">${esc(T('Use my own road coordinates (from the map)', 'अपने सड़क निर्देशांक डालें (नक्शे से)'))}</summary>
        <p class="muted" style="margin:6px 0">${esc(T('Paste points along the road, one per line, as: latitude, longitude. Copy them from Google Maps (right-click, click the numbers). First point near the depot, last near the MRF. 2 to 500 points.', 'सड़क के साथ बिंदु पेस्ट करें, हर लाइन में: अक्षांश, देशांतर। Google Maps में राइट-क्लिक करके नंबर कॉपी करें। पहला बिंदु डिपो के पास, आख़िरी एमआरएफ के पास। 2 से 500 बिंदु।'))}</p>
        <textarea class="i" id="rPaste" rows="6" placeholder="27.98601, 94.22049&#10;27.98720, 94.22051"></textarea>
        <div class="row" style="margin-top:6px"><button class="btn sm" id="rUse">${esc(T('Use these coordinates', 'ये निर्देशांक इस्तेमाल करें'))}</button></div></details>
      <div class="row" style="margin-top:10px"><button class="btn alt" id="rPrev">${esc(T('Preview on roads', 'सड़कों पर देखें'))}</button><button class="btn" id="rSave">${esc(T('Save route', 'रास्ता सेव करें'))}</button>${r && r.RouteID ? `<button class="btn bad sm" id="rDel">${esc(T('Delete', 'हटाएँ'))}</button>` : ''}</div><p class="muted" id="rMsg"></p>`;
    stopsList();
    $('#rAddB').onclick = () => { RB.stops.push($('#rAdd').value); RB.plan = null; stopsList(); drawMap(); };
    $('#rMode').onchange = e => { RB.mode = e.target.value; };
    $('#rPrev').onclick = preview; $('#rSave').onclick = save; $('#rUse').onclick = useCoords;
    if ($('#rDel')) $('#rDel').onclick = async () => { if (!confirm(T('Delete this route?', 'यह रास्ता हटाएँ?'))) return; try { await api('del', { tab: 'Routes', id: RB.cur.RouteID }); await refreshStatic(); route(); } catch (e) { toast(e.message, true); } };
  }
  function stopsList() {
    $('#rStops').innerHTML = RB.stops.map((id, i) => `<li><span class="no">${i + 1}</span><div style="flex:1"><b>${esc(pl[id] ? pl[id].Name : id)}</b><div class="muted">${esc(pl[id] ? pl[id].Type : '?')}</div></div><button class="btn sm grey" data-u="${i}">▲</button><button class="btn sm grey" data-d="${i}">▼</button><button class="btn sm grey" data-x="${i}">✕</button></li>`).join('');
    const mv = (i, j) => { if (j < 0 || j >= RB.stops.length) return; const t = RB.stops[i]; RB.stops[i] = RB.stops[j]; RB.stops[j] = t; RB.plan = null; stopsList(); drawMap(); };
    $$('[data-u]', el).forEach(b => b.onclick = () => mv(+b.dataset.u, +b.dataset.u - 1));
    $$('[data-d]', el).forEach(b => b.onclick = () => mv(+b.dataset.d, +b.dataset.d + 1));
    $$('[data-x]', el).forEach(b => b.onclick = () => { RB.stops.splice(+b.dataset.x, 1); RB.plan = null; stopsList(); drawMap(); });
  }
  function drawMap() {
    lg.clearLayers();
    const pts = RB.stops.map(id => pl[id]).filter(Boolean);
    pts.forEach((p, i) => placeMarker(p, i === 0 ? 'D' : i === pts.length - 1 ? 'M' : i).addTo(lg));
    const line = RB.plan && RB.plan.geometry && RB.plan.geometry.length > 1 ? RB.plan.geometry : pts.map(p => [num(p.Lat), num(p.Lng)]);
    if (line.length > 1) { L.polyline(line, { color: '#1E88E5', weight: 5, opacity: .8, dashArray: RB.plan && RB.plan.onRoad ? null : '6 8' }).addTo(lg); m.fitBounds(L.latLngBounds(line).pad(.2)); }
    const p = RB.plan;
    $('#rSum').innerHTML = p ? `<b>${p.distanceKm} km</b> · ${p.durationMin} min${p.savedPct ? ` · ${esc(T('shorter by ', 'छोटा '))}<b>${p.savedPct}%</b> ${esc(T('than your order', 'आपके क्रम से'))} (${p.originalKm} → ${p.optimisedKm} km)` : ''}${p.onRoad ? '' : ' · ' + esc(T('straight lines (not on roads yet)', 'सीधी रेखाएँ (अभी सड़कों पर नहीं)'))}${p.approx ? ' · ' + esc(T('distance estimated', 'दूरी अनुमानित')) : ''}${p.note ? '<br>' + esc(p.note) : ''}` : esc(T('Preview the route to see distance and time.', 'दूरी और समय देखने के लिए रास्ता देखें।'));
  }
  function useCoords() {
    const pts = [];
    $('#rPaste').value.split(/\n/).forEach(line => {
      const m2 = line.match(/(-?\d+\.\d+)\s*[,;\s]\s*(-?\d+\.\d+)/); if (!m2) return;
      let a = parseFloat(m2[1]), b = parseFloat(m2[2]); if (a > 60 && b < 60) { const t = a; a = b; b = t; }
      pts.push([a, b]);
    });
    const bad = pts.filter(p => !(p[0] > 27.5 && p[0] < 28.5 && p[1] > 93.7 && p[1] < 94.7));
    if (pts.length < 2) return toast(T('Need at least 2 points, one per line.', 'कम से कम 2 बिंदु चाहिए, हर लाइन में एक।'), true);
    if (bad.length) return toast(T('Some points are outside Daporijo. Check the numbers.', 'कुछ बिंदु दापोरिजो के बाहर हैं। नंबर जाँचें।'), true);
    let g = pts;
    if (g.length > 500) { const out = []; for (let i = 0; i < 500; i++) out.push(g[Math.round(i * (g.length - 1) / 499)]); g = out; }
    g = g.map(p => [Math.round(p[0] * 1e5) / 1e5, Math.round(p[1] * 1e5) / 1e5]);
    let m = 0; for (let i = 1; i < g.length; i++) m += hav(g[i - 1][0], g[i - 1][1], g[i][0], g[i][1]);
    const far = RB.stops.map(id => pl[id]).filter(Boolean).filter(p => Math.min.apply(null, g.map(q => hav(num(p.Lat), num(p.Lng), q[0], q[1]))) > 60).map(p => p.Name);
    RB.plan = { geometry: g, distanceKm: Math.round(m / 10) / 100, durationMin: Math.max(1, Math.round(m / 1000 / num(S.st.config.AvgSpeedKmh, 20) * 60)), onRoad: true, saved: false, note: T('Road line from your coordinates.', 'आपके निर्देशांक से सड़क रेखा।') + (far.length ? ' ' + T('Stops more than 60 m from the line: ', '60 मीटर से दूर पड़ाव: ') + far.join(', ') + '.' : '') };
    drawMap(); $('#rMsg').textContent = T('Now press Save route.', 'अब रास्ता सेव करें दबाएँ।');
  }
  async function preview() {
    if (RB.stops.length < 2) return toast(T('Add at least two stops.', 'कम से कम दो पड़ाव जोड़ें।'), true);
    $('#rMsg').textContent = T('Planning on roads…', 'सड़कों पर रास्ता बन रहा है…');
    try {
      const d = await api('plan', { stops: RB.stops.join(','), mode: RB.mode, optimise: $('#rOpt').checked ? 1 : 0 }, { timeout: 45000 });
      RB.plan = d; RB.stops = d.order; stopsList(); drawMap(); $('#rMsg').textContent = '';
    } catch (e) { $('#rMsg').textContent = e.message; }
  }
  async function save() {
    const name = $('#rName').value.trim(); if (!name) return toast(T('Give the route a name.', 'रास्ते को नाम दें।'), true);
    if (RB.stops.length < 2) return toast(T('Add at least two stops.', 'कम से कम दो पड़ाव जोड़ें।'), true);
    const btn = $('#rSave'); btn.disabled = true;
    try {
      const data = { Name: name, Mode: RB.mode, StopPlaceIDs: RB.stops.join(',') };
      if (RB.cur && RB.cur.RouteID) data.RouteID = RB.cur.RouteID;
      const fresh = RB.plan && !RB.plan.saved;
      if (!fresh && RB.stops.join(',') !== RB.orig) data.GeometryJSON = '';
      if (fresh) { data.DistanceKm = RB.plan.distanceKm; data.DurationMin = RB.plan.durationMin; }
      const r = await api('save', { tab: 'Routes', data: JSON.stringify(data) });
      if (fresh) {
        post('saveRouteGeometry', { routeId: r.row.RouteID, stops: RB.stops.join(','), geometry: RB.plan.geometry, distanceKm: RB.plan.distanceKm, durationMin: RB.plan.durationMin });
        await new Promise(res => setTimeout(res, 2500));
        const chk = await api('route', { id: r.row.RouteID });
        if (!chk.geometry.length) toast(T('Route saved but the road line did not save. Press Save again.', 'रास्ता सेव हुआ पर सड़क की रेखा नहीं। फिर सेव दबाएँ।'), true);
      }
      await refreshStatic(); toast(T('Route saved', 'रास्ता सेव हुआ')); route();
    } catch (e) { toast(e.message, true); btn.disabled = false; }
  }
  $('#rNew').onclick = () => {
    const dep = places.find(p => p.Type === 'Depot'), mrf = places.find(p => p.Type === 'MRF');
    open({ Name: '', Mode: 'driving-car', StopPlaceIDs: [dep, mrf].filter(Boolean).map(p => p.PlaceID).join(',') });
    RB.orig = '';
  };
  $('#rAll').onclick = async () => {
    const msg = $('#rAllMsg'); $('#rAll').disabled = true; let ok = 0;
    for (const r of RB.routes) {
      msg.textContent = T('Drawing ', 'बन रहा है ') + r.Name + '…';
      try {
        const d = await api('plan', { stops: r.StopPlaceIDs, mode: r.Mode || 'driving-car', optimise: 0 }, { timeout: 45000 });
        if (!d.onRoad) { msg.textContent = d.note || 'No road route'; continue; }
        post('saveRouteGeometry', { routeId: r.RouteID, stops: d.order.join(','), geometry: d.geometry, distanceKm: d.distanceKm, durationMin: d.durationMin });
        await new Promise(res => setTimeout(res, 2200)); ok++;
      } catch (e) { msg.textContent = r.Name + ': ' + e.message; }
    }
    await refreshStatic(); toast(T('Roads drawn for ', 'सड़कें बनीं ') + ok + T(' routes', ' रास्तों के लिए')); route();
  };
  list(); form(); if (RB.routes.length) open(RB.routes[0]);
}

/* ---------- generic table editor ---------- */
async function crud(el, cfg) {
  const d = await api('list', { tab: cfg.tab });
  el.innerHTML = `<div class="card" style="margin-bottom:12px"><div class="row"><h3 style="margin:0">${esc(cfg.title)}</h3><div class="sp"></div>${cfg.noAdd ? '' : `<button class="btn sm" data-add>+ ${esc(T('Add', 'जोड़ें'))}</button>`}${cfg.extra || ''}</div>
    <div class="scroll" style="margin-top:8px"><table><thead><tr>${cfg.cols.map(c => `<th>${esc(c[1])}</th>`).join('')}<th></th></tr></thead><tbody>${d.rows.map((r, i) => `<tr>${cfg.cols.map(c => `<td>${esc(c[2] ? c[2](r) : r[c[0]])}</td>`).join('')}<td style="white-space:nowrap"><button class="btn sm grey" data-e="${i}">${esc(T('Edit', 'बदलें'))}</button>${cfg.noDel ? '' : ` <button class="btn sm grey" data-x="${i}">✕</button>`}</td></tr>`).join('')}</tbody></table></div></div>`;
  const key = { Households: 'HouseholdID', Vehicles: 'VehicleID', Users: 'UserID', Rates: 'Category' }[cfg.tab];
  const edit = async row => {
    const o = await editor(row ? T('Edit', 'बदलें') : T('Add', 'जोड़ें'), cfg.fields(), Object.assign({}, cfg.defaults || {}, row || {}));
    if (!o) return; if (row) o[key] = row[key];
    try { if (cfg.before) cfg.before(o); await api('save', { tab: cfg.tab, data: JSON.stringify(o) }); await refreshStatic(); toast(T('Saved', 'सेव हुआ')); route(); } catch (e) { toast(e.message, true); }
  };
  $$('[data-add]', el).forEach(b => b.onclick = () => edit(null));
  $$('[data-e]', el).forEach(b => b.onclick = () => edit(d.rows[+b.dataset.e]));
  $$('[data-x]', el).forEach(b => b.onclick = async () => { const r = d.rows[+b.dataset.x]; if (!confirm(T('Delete ', 'हटाएँ ') + r[key] + '?')) return; try { await api('del', { tab: cfg.tab, id: r[key] }); await refreshStatic(); route(); } catch (e) { toast(e.message, true); } });
  return d.rows;
}

/* ---------- Households ---------- */
function printArea(html) { const p = $('#printArea'); p.innerHTML = html; setTimeout(() => { window.print(); }, 300); }
async function adminHouseholds(el) {
  const pts = S.st.places.filter(p => p.Type === 'Pickup Point');
  const holder = document.createElement('div'); el.appendChild(holder);
  const rows = await crud(holder, {
    tab: 'Households', title: T('Households', 'घर'), cols: [['HouseholdID', 'ID'], ['Label', T('Name', 'नाम')], ['PlaceID', T('Pickup point', 'पिकअप पॉइंट'), r => (PLACE(r.PlaceID) || {}).Name || r.PlaceID], ['Source', T('Source', 'स्रोत')]],
    fields: () => [{ k: 'Label', label: T('Name of household or building', 'घर या भवन का नाम') }, { k: 'PlaceID', label: T('Pickup point', 'पिकअप पॉइंट'), type: 'select', opts: pts.map(p => [p.PlaceID, p.Name]) }, { k: 'Members', label: T('People', 'सदस्य'), type: 'number' }],
    defaults: { Members: 4 }, before: o => { const p = PLACE(o.PlaceID); if (p) { o.Colony = p.Colony; o.Lat = num(o.Lat) || p.Lat; o.Lng = num(o.Lng) || p.Lng; } },
    extra: `<button class="btn alt sm" id="hPrint">🖨 ${esc(T('Print bag tags', 'बैग टैग प्रिंट करें'))}</button>`,
  });
  $('#hPrint').onclick = () => {
    printArea(rows.map(h => `<div class="tagcard"><div><div class="brand" style="justify-content:flex-start"><img src="logo.png" alt=""><span>WasteWise Daporijo<br>${esc(SCHOOL.name)}</span></div><b style="font-size:16pt">${esc(h.HouseholdID)}</b><div>${esc(h.Label)}</div><div style="font-size:9pt">${esc((PLACE(h.PlaceID) || {}).Name || '')}</div></div><div style="text-align:center"><img src="${qrImg('WW|' + h.HouseholdID + '|Wet', 5)}"><div><b>WET / गीला</b></div></div><div style="text-align:center"><img src="${qrImg('WW|' + h.HouseholdID + '|Dry', 5)}"><div><b>DRY / सूखा</b></div></div></div>`).join(''));
  };
}

/* ---------- Fleet, users, rates ---------- */
async function adminFleet(el) {
  const a = document.createElement('div'), b = document.createElement('div'), c = document.createElement('div'); el.append(a, b, c);
  await crud(a, { tab: 'Vehicles', title: T('Vehicles', 'वाहन'), cols: [['VehicleID', 'ID'], ['Name', T('Name', 'नाम')], ['Type', T('Type', 'प्रकार')], ['CapacityKg', 'kg'], ['RouteID', T('Default route', 'डिफ़ॉल्ट रास्ता')]],
    fields: () => [{ k: 'Name', label: T('Name', 'नाम') }, { k: 'Type', label: T('Type', 'प्रकार') }, { k: 'CapacityKg', label: T('Capacity (kg)', 'क्षमता (किलो)'), type: 'number' }, { k: 'RouteID', label: T('Default route', 'डिफ़ॉल्ट रास्ता'), type: 'select', opts: S.st.routes.map(r => [r.RouteID, r.Name]) }, { k: 'Active', label: T('Active', 'सक्रिय'), type: 'select', opts: [['1', 'Yes'], ['0', 'No']] }], defaults: { Active: '1' } });
  await crud(b, { tab: 'Users', title: T('Staff logins', 'स्टाफ लॉगिन'), cols: [['UserID', 'ID'], ['Name', T('Name', 'नाम')], ['Role', T('Role', 'भूमिका')], ['Passcode', T('Passcode', 'पासकोड'), r => '••••']],
    fields: () => [{ k: 'Name', label: T('Name', 'नाम') }, { k: 'Role', label: T('Role', 'भूमिका'), type: 'select', opts: ['driver', 'mrf', 'incharge', 'admin'] }, { k: 'Passcode', label: T('Passcode (change the demo ones)', 'पासकोड (डेमो वाले बदलें)') }, { k: 'Active', label: T('Active', 'सक्रिय'), type: 'select', opts: [['1', 'Yes'], ['0', 'No']] }], defaults: { Active: '1', Role: 'driver' } });
  await crud(c, { tab: 'Rates', title: T('Rates at the MRF (₹ per kg)', 'एमआरएफ दरें (₹ प्रति किलो)'), noAdd: true, noDel: true, cols: [['Category', T('Category', 'श्रेणी')], ['RatePerKg', '₹/kg'], ['Note', T('Note', 'टिप्पणी')]],
    fields: () => [{ k: 'Category', label: T('Category', 'श्रेणी'), ro: true }, { k: 'RatePerKg', label: '₹/kg', type: 'number', step: '0.1' }, { k: 'Note', label: T('Note', 'टिप्पणी') }] });
}

/* ---------- Data ---------- */
async function adminData(el) {
  const demo = S.st.config.DemoMode;
  const cnt = {}; S.st.places.forEach(p => { cnt[p.Type] = (cnt[p.Type] || 0) + 1; });
  const ph = S.st.places.filter(p => /PLACEHOLDER/i.test(p.Name));
  el.innerHTML = `<div class="grid g2">
    <div class="card"><h3>${esc(T('Demo mode', 'डेमो मोड'))}: <span class="tag ${demo ? 'partly' : 'good'}">${demo ? 'ON' : 'OFF'}</span></h3>
      <p class="muted">${esc(T('ON: new households, trips and pickups are tagged DEMO and can be wiped. OFF: they are saved as real (LIVE) records.', 'ON: नए घर, ट्रिप और पिकअप DEMO टैग होते हैं और मिटाए जा सकते हैं। OFF: वे असली (LIVE) रिकॉर्ड बनते हैं।'))}</p>
      <div class="row" style="margin-top:8px"><button class="btn alt" id="dTog">${esc(demo ? T('Turn demo mode OFF', 'डेमो मोड बंद करें') : T('Turn demo mode ON', 'डेमो मोड चालू करें'))}</button><button class="btn bad" id="dWipe">${esc(T('Wipe demo data', 'डेमो डेटा मिटाएँ'))}</button></div>
      <p class="muted" style="margin-top:8px">${esc(T('Wiping removes only rows tagged DEMO (sample trips, pickups, receipts, alerts, demo households). Real places and routes stay.', 'मिटाने पर सिर्फ DEMO टैग वाली पंक्तियाँ हटती हैं (नमूना ट्रिप, पिकअप, रसीद, अलर्ट, डेमो घर)। असली स्थान और रास्ते रहते हैं।'))}</p></div>
    <div class="card"><h3>${esc(T('What is in the database', 'डेटाबेस में क्या है'))}</h3>
      <ul class="feed">${Object.keys(cnt).map(k => `<li>${esc(k)}: <b>${cnt[k]}</b></li>`).join('')}<li>${esc(T('Routes', 'रास्ते'))}: <b>${S.st.routes.length}</b> · ${esc(T('Vehicles', 'वाहन'))}: <b>${S.st.vehicles.length}</b></li></ul>
      ${ph.length ? `<p style="margin-top:8px"><span class="tag partly">${esc(T('To do', 'करना है'))}</span> ${esc(T('Set the real position of: ', 'असली स्थान डालें: '))}${ph.map(p => esc(p.Name)).join('; ')} (Places tab).</p>` : ''}</div>
    <div class="card"><h3>${esc(T('Print', 'प्रिंट'))}</h3><div class="row"><button class="btn alt" id="dPoster">${esc(T('Citizen QR poster', 'नागरिक QR पोस्टर'))}</button></div><p class="muted" style="margin-top:6px">${esc(T('Visitors scan the poster to register and follow the truck. Bag tags are printed from the Households tab.', 'आगंतुक पोस्टर स्कैन कर पंजीकरण करते और ट्रक देखते हैं। बैग टैग घर टैब से प्रिंट होते हैं।'))}</p></div>
    <div class="card"><h3>${esc(T('How to feed real data', 'असली डेटा कैसे जोड़ें'))}</h3><ol style="padding-left:18px"><li>${esc(T('Places: tap the map or paste a list (Places tab).', 'स्थान: नक्शा छूएँ या सूची पेस्ट करें।'))}</li><li>${esc(T('Routes: pick stops in order, Preview on roads, Save.', 'रास्ते: पड़ाव क्रम से चुनें, सड़कों पर देखें, सेव करें।'))}</li><li>${esc(T('Households: add them or let people register themselves.', 'घर: जोड़ें या लोग खुद पंजीकरण करें।'))}</li><li>${esc(T('Turn demo mode OFF and wipe demo data.', 'डेमो मोड बंद करें और डेमो डेटा मिटाएँ।'))}</li></ol></div></div>`;
  $('#dTog').onclick = async () => { try { await api('save', { tab: 'Config', data: JSON.stringify({ Key: 'DemoMode', Value: demo ? '0' : '1' }) }); await refreshStatic(); route(); } catch (e) { toast(e.message, true); } };
  $('#dWipe').onclick = async () => { if (!confirm(T('Wipe all DEMO data?', 'सारा DEMO डेटा मिटाएँ?'))) return; try { const r = await api('clearDemo', {}, { timeout: 60000 }); toast(T('Removed: ', 'हटाया: ') + Object.keys(r.removed).map(k => k + ' ' + r.removed[k]).join(', ')); } catch (e) { toast(e.message, true); } };
  $('#dPoster').onclick = () => {
    const url = location.href.split('#')[0] + '#/citizen';
    printArea(`<div class="poster"><img src="logo.png" style="width:30mm" onerror="this.style.display='none'"><h1>WasteWise Daporijo</h1><p style="margin:0 0 6mm"><b>${esc(SCHOOL.name)}</b>, Daporijo<br>${esc(SCHOOL.event)} · ${esc(SCHOOL.theme)}</p><h2>Scan to register and see your truck<br>स्कैन करें, पंजीकरण करें और अपना ट्रक देखें</h2><img src="${qrImg(url, 8)}"><p style="font-size:11pt;word-break:break-all">${esc(url)}</p><p style="font-size:10pt;margin-top:8mm">Team: ${esc(SCHOOL.team)} · Guide teacher: ${esc(SCHOOL.guide)}</p></div>`);
  };
}
