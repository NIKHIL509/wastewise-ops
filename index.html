    $('#aRows').innerHTML = list.map(r => `<tr style="${String(r.Active) === '0' ? 'opacity:.5' : ''}"><td>${esc(r.PlaceID)}</td><td>${esc(r.Name)}${String(r.Source) === 'PLACEHOLDER' ? ' <span class="tag partly">placeholder</span>' : ''}<div class="muted">${esc(r.Colony || '')} ${esc(r.RoadID || '')}</div></td><td>${esc(r.Type)}</td><td><button class="btn sm grey" data-e="${esc(r.PlaceID)}">${esc(T('Edit', 'बदलें'))}</button></td></tr>`).join('');
    $$('[data-e]', el).forEach(b => b.onclick = () => edit(rows.find(r => r.PlaceID === b.dataset.e)));
    layer.clearLayers();
    list.filter(r => String(r.Active) !== '0').forEach(r => { placeMarker(r, null).on('click', () => {}).addTo(layer); });
    $('#aCount').textContent = list.length + ' / ' + rows.length + ' ' + T('places', 'स्थान');
  }
  async function edit(row, extra) {
    const vals = Object.assign({ Type: 'Pickup Point', Active: '1' }, row || {}, extra || {});
    const o = await editor(row ? T('Edit place', 'स्थान बदलें') : T('New place', 'नया स्थान'), PLACE_FIELDS(), vals);
    if (!o) return;
    if (row) { o.PlaceID = row.PlaceID; o.Source = row.Source === 'PLACEHOLDER' ? 'LIVE' : row.Source; }
    try { await savePlace(o); } catch (e) { toast(e.message, true); }
  }
  m.on('click', e => edit(null, { Lat: e.latlng.lat.toFixed(6), Lng: e.latlng.lng.toFixed(6) }));
  const pts = rows.filter(r => num(r.Lat)).map(r => [num(r.Lat), num(r.Lng)]);
  if (pts.length) { const core = rows.filter(r => r.Type !== 'Dump Site' && num(r.Lat)).map(r => [num(r.Lat), num(r.Lng)]); m.fitBounds(L.latLngBounds(core.length ? core : pts).pad(.3)); }
  $('#aType').onchange = draw; $('#aQ').oninput = draw; draw();
  $('#aAdd').onclick = () => { const c = m.getCenter(); edit(null, { Lat: c.lat.toFixed(6), Lng: c.lng.toFixed(6) }); };
  $('#aGps').onclick = () => {
    if (!navigator.geolocation) return toast('GPS not available', true);
    navigator.geolocation.getCurrentPosition(p => edit(null, { Lat: p.coords.latitude.toFixed(6), Lng: p.coords.longitude.toFixed(6) }), e => toast(e.message, true), { enableHighAccuracy: true });
  };
  $('#aImp').onclick = async () => { $('#aImp').disabled = true; try { const r = await api('importSurvey', {}, { timeout: 40000 }); await refreshStatic(); toast(T('Imported ', 'लाए गए ') + r.imported + T(' dump sites', ' कचरा स्थल')); route(); } catch (e) { toast(e.message, true); $('#aImp').disabled = false; } };
  $('#aPaste').onclick = () => {
    const mm = modal(`<h3>${esc(T('Paste a list of places', 'स्थानों की सूची पेस्ट करें'))}</h3><p class="muted">${esc(T('One place per line: Name, latitude, longitude, Type (optional), Colony (optional). Example:', 'हर लाइन में एक स्थान: नाम, अक्षांश, देशांतर, प्रकार (वैकल्पिक), कॉलोनी (वैकल्पिक)। उदाहरण:'))}<br><code>Toli Hotel gate, 27.990032, 94.221563, Pickup Point, Gandhi Market</code></p><textarea class="i" id="pasteTxt" rows="9"></textarea><div class="row" style="margin-top:12px"><button class="btn" id="pasteGo">${esc(T('Import', 'इम्पोर्ट'))}</button><button class="btn grey" id="pasteNo">${esc(T('Cancel', 'रद्द करें'))}</button></div><p class="muted" id="pasteMsg"></p>`);
    $('#pasteNo').onclick = mm.close;
    $('#pasteGo').onclick = async () => {
      const list = [];
      $('#pasteTxt').value.split(/\n/).forEach(line => { const p = line.split(/[,\t]/).map(s => s.trim()); if (p.length >= 3 && isFinite(p[1]) && isFinite(p[2]) && p[0]) list.push({ Name: p[0], Lat: p[1], Lng: p[2], Type: p[3] || 'Pickup Point', Colony: p[4] || '' }); });
      if (!list.length) { $('#pasteMsg').textContent = T('No valid lines found.', 'कोई सही लाइन नहीं मिली।'); return; }
      post('importPlaces', { data: list }); mm.close(); toast(T('Importing ', 'इम्पोर्ट हो रहा ') + list.length + '…');
      setTimeout(async () => { await refreshStatic(); route(); }, 3500);
    };
  };
}

/* ---------- Routes ---------- */
async function adminRoutes(el) {
  const rd = await api('list', { tab: 'Routes' });
  const pd = await api('list', { tab: 'Places' });
  const places = pd.rows.filter(p => String(p.Active) !== '0'); const pl = {}; places.forEach(p => pl[p.PlaceID] = p);
  const RB = { routes: rd.rows, cur: null, stops: [], mode: 'driving-car', plan: null, orig: '' };
  el.innerHTML = `<div class="grid g2">
    <div class="grid" style="align-content:start">
      <div class="card"><div class="row"><h3 style="margin:0">${esc(T('Routes', 'रास्ते'))}</h3><div class="sp"></div><button class="btn sm" id="rNew">+ ${esc(T('New route', 'नया रास्ता'))}</button></div><div id="rList" style="margin-top:8px"></div>
        <div class="row" style="margin-top:10px"><button class="btn alt sm" id="rAll">${esc(T('Draw all routes on roads', 'सभी रास्ते सड़कों पर बनाएँ'))}</button></div><p class="muted" id="rAllMsg"></p></div>
      <div class="card" id="rEdit"></div>
    </div>
    <div class="card"><h3>${esc(T('Route on the map', 'नक्शे पर रास्ता'))}</h3><div id="rMap" class="map tall"></div><div id="rSum" class="muted" style="margin-top:8px"></div></div></div>`;
  const m = makeMap($('#rMap'), { zoom: 15 }); S.maps.rMap = m;
  const lg = L.layerGroup().addTo(m);
  function list() {
    $('#rList').innerHTML = RB.routes.map(r => `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><div><b>${esc(r.Name)}</b><div class="muted">${esc(r.RouteID)} · ${ids(r).length} ${esc(T('stops', 'पड़ाव'))} · ${r.hasGeometry ? '✔ ' + esc(T('on roads', 'सड़कों पर')) + ' ' + (r.DistanceKm || '') + ' km' : esc(T('straight lines only', 'सीधी रेखाएँ'))}</div></div><div class="sp"></div><button class="btn sm ${RB.cur && RB.cur.RouteID === r.RouteID ? '' : 'alt'}" data-r="${esc(r.RouteID)}">${esc(T('Open', 'खोलें'))}</button></div>`).join('') || `<p class="muted">—</p>`;
    $$('[data-r]', el).forEach(b => b.onclick = () => open(RB.routes.find(r => r.RouteID === b.dataset.r)));
  }
  async function open(r) {
    RB.cur = r; RB.stops = r ? ids(r) : []; RB.mode = r ? (r.Mode || 'driving-car') : 'driving-car'; RB.plan = null; RB.orig = RB.stops.join(',');
    list(); form();
    if (r && r.hasGeometry) { try { const g = await api('route', { id: r.RouteID }); RB.plan = { geometry: g.geometry, distanceKm: r.DistanceKm, durationMin: r.DurationMin, saved: true, onRoad: true }; } catch (e) {} }
    drawMap();
  }
  function form() {
    const r = RB.cur;
    const addOpts = PTYPES.map(t => { const g = places.filter(p => p.Type === t); return g.length ? `<optgroup label="${t}">${g.map(p => `<option value="${esc(p.PlaceID)}">${esc(p.Name)}</option>`).join('')}</optgroup>` : ''; }).join('');
    $('#rEdit').innerHTML = `<h3>${r && r.RouteID ? esc(r.RouteID) : esc(T('New route', 'नया रास्ता'))}</h3>
      <label class="f">${esc(T('Name', 'नाम'))}</label><input class="i" id="rName" value="${esc(r ? r.Name : '')}">
      <label class="f">${esc(T('Vehicle type', 'वाहन प्रकार'))}</label><select class="i" id="rMode"><option value="driving-car" ${RB.mode === 'driving-car' ? 'selected' : ''}>${esc(T('Road vehicle (truck or pickup)', 'सड़क वाहन (ट्रक या पिकअप)'))}</option><option value="foot-walking" ${RB.mode === 'foot-walking' ? 'selected' : ''}>${esc(T('Walking (handcart, survey)', 'पैदल (हाथगाड़ी, सर्वे)'))}</option></select>
      <label class="f">${esc(T('Stops in order (first = depot, last = MRF)', 'पड़ाव क्रम से (पहला = डिपो, आख़िरी = एमआरएफ)'))}</label>
      <ol class="stops" id="rStops" style="padding:0"></ol>
      <div class="row" style="margin-top:6px"><select class="i" id="rAdd" style="flex:1">${addOpts}</select><button class="btn sm" id="rAddB">+ ${esc(T('Add stop', 'पड़ाव जोड़ें'))}</button></div>
      <label class="row muted" style="margin-top:10px"><input type="checkbox" id="rOpt" checked> ${esc(T('Find the shortest order of the middle stops', 'बीच के पड़ावों का सबसे छोटा क्रम खोजें'))}</label>
      <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">${esc(T('Use my own road coordinates (from the map)', 'अपने सड़क निर्देशांक डालें (नक्शे से)'))}</summary>
        <p class="muted" style="margin:6px 0">${esc(T('Paste points along the road, one per line, as: latitude, longitude. Copy them from Google Maps (right-click, click the numbers). First point near the depot, last near the MRF. 2 to 500 points.', 'सड़क के साथ बिंदु पेस्ट करें, हर लाइन में: अक्षांश, देशांतर। Google Maps में राइट-क्लिक करके नंबर कॉपी करें। पहला बिंदु डिपो के पास, आख़िरी एमआरएफ के पास। 2 से 500 बिंदु।'))}</p>
        <textarea class="i" id="rPaste" rows="6" placeholder="27.98601, 94.22049&#10;27.98720, 94.22051"></textarea>
        <div class="row" style="margin-top:6px"><button class="btn sm" id="rUse">${esc(T('Use these coordinates', 'ये निर्देशांक इस्तेमाल करें'))}</button></div></details>
      <div class="row" style="margin-top:10px"><button class="btn alt" id="rPrev">${esc(T('Preview on roads', 'सड़कों पर देखें'))}</button><button class="btn" id="rSave">${esc(T('Save route', 'रास्ता सेव करें'))}</button>${r && r.RouteID ? `<button class="btn bad sm" id="rDel">${esc(T('Delete', 'हटाएँ'))}</button>` : ''}</div><p class="muted" id="rMsg"></p>`;
    stopsList();
    $('#rAddB').onclick = () => { RB.stops.push($('#rAdd').value); RB.plan = null; stopsList(); drawMap(); };
    $('#rMode').onchange = e => { RB.mode = e.target.value; };
    $('#rPrev').onclick = preview; $('#rSave').onclick = save; $('#rUse').onclick = useCoords;
    if ($('#rDel')) $('#rDel').onclick = async () => { if (!confirm(T('Delete this route?', 'यह रास्ता हटाएँ?'))) return; try { await api('del', { tab: 'Routes', id: RB.cur.RouteID }); await refreshStatic(); route(); } catch (e) { toast(e.message, true); } };
  }
  function stopsList() {
    $('#rStops').innerHTML = RB.stops.map((id, i) => `<li><span class="no">${i + 1}</span><div style="flex:1"><b>${esc(pl[id] ? pl[id].Name : id)}</b><div class="muted">${esc(pl[id] ? pl[id].Type : '?')}</div></div><button class="btn sm grey" data-u="${i}">▲</button><button class="btn sm grey" data-d="${i}">▼</button><button class="btn sm grey" data-x="${i}">✕</button></li>`).join('');
    const mv = (i, j) => { if (j < 0 || j >= RB.stops.length) return; const t = RB.stops[i]; RB.stops[i] = RB.stops[j]; RB.stops[j] = t; RB.plan = null; stopsList(); drawMap(); };
    $$('[data-u]', el).forEach(b => b.onclick = () => mv(+b.dataset.u, +b.dataset.u - 1));
    $$('[data-d]', el).forEach(b => b.onclick = () => mv(+b.dataset.d, +b.dataset.d + 1));
    $$('[data-x]', el).forEach(b => b.onclick = () => { RB.stops.splice(+b.dataset.x, 1); RB.plan = null; stopsList(); drawMap(); });
  }
  function drawMap() {
    lg.clearLayers();
    const pts = RB.stops.map(id => pl[id]).filter(Boolean);
    pts.forEach((p, i) => placeMarker(p, i === 0 ? 'D' : i === pts.length - 1 ? 'M' : i).addTo(lg));
    const line = RB.plan && RB.plan.geometry && RB.plan.geometry.length > 1 ? RB.plan.geometry : pts.map(p => [num(p.Lat), num(p.Lng)]);
    if (line.length > 1) { L.polyline(line, { color: '#1E88E5', weight: 5, opacity: .8, dashArray: RB.plan && RB.plan.onRoad ? null : '6 8' }).addTo(lg); m.fitBounds(L.latLngBounds(line).pad(.2)); }
    const p = RB.plan;
    $('#rSum').innerHTML = p ? `<b>${p.distanceKm} km</b> · ${p.durationMin} min${p.savedPct ? ` · ${esc(T('shorter by ', 'छोटा '))}<b>${p.savedPct}%</b> ${esc(T('than your order', 'आपके क्रम से'))} (${p.originalKm} → ${p.optimisedKm} km)` : ''}${p.onRoad ? '' : ' · ' + esc(T('straight lines (not on roads yet)', 'सीधी रेखाएँ (अभी सड़कों पर नहीं)'))}${p.approx ? ' · ' + esc(T('distance estimated', 'दूरी अनुमानित')) : ''}${p.note ? '<br>' + esc(p.note) : ''}` : esc(T('Preview the route to see distance and time.', 'दूरी और समय देखने के लिए रास्ता देखें।'));
  }
  function useCoords() {
    const pts = [];
    $('#rPaste').value.split(/\n/).forEach(line => {
      const m2 = line.match(/(-?\d+\.\d+)\s*[,;\s]\s*(-?\d+\.\d+)/); if (!m2) return;
      let a = parseFloat(m2[1]), b = parseFloat(m2[2]); if (a > 60 && b < 60) { const t = a; a = b; b = t; }
      pts.push([a, b]);
    });
    const bad = pts.filter(p => !(p[0] > 27.5 && p[0] < 28.5 && p[1] > 93.7 && p[1] < 94.7));
    if (pts.length < 2) return toast(T('Need at least 2 points, one per line.', 'कम से कम 2 बिंदु चाहिए, हर लाइन में एक।'), true);
    if (bad.length) return toast(T('Some points are outside Daporijo. Check the numbers.', 'कुछ बिंदु दापोरिजो के बाहर हैं। नंबर जाँचें।'), true);
    let g = pts;
    if (g.length > 500) { const out = []; for (let i = 0; i < 500; i++) out.push(g[Math.round(i * (g.length - 1) / 499)]); g = out; }
    g = g.map(p => [Math.round(p[0] * 1e5) / 1e5, Math.round(p[1] * 1e5) / 1e5]);
    let m = 0; for (let i = 1; i < g.length; i++) m += hav(g[i - 1][0], g[i - 1][1], g[i][0], g[i][1]);
    const far = RB.stops.map(id => pl[id]).filter(Boolean).filter(p => Math.min.apply(null, g.map(q => hav(num(p.Lat), num(p.Lng), q[0], q[1]))) > 60).map(p => p.Name);
    RB.plan = { geometry: g, distanceKm: Math.round(m / 10) / 100, durationMin: Math.max(1, Math.round(m / 1000 / num(S.st.config.AvgSpeedKmh, 20) * 60)), onRoad: true, saved: false, note: T('Road line from your coordinates.', 'आपके निर्देशांक से सड़क रेखा।') + (far.length ? ' ' + T('Stops more than 60 m from the line: ', '60 मीटर से दूर पड़ाव: ') + far.join(', ') + '.' : '') };
    drawMap(); $('#rMsg').textContent = T('Now press Save route.', 'अब रास्ता सेव करें दबाएँ।');
  }
  async function preview() {
    if (RB.stops.length < 2) return toast(T('Add at least two stops.', 'कम से कम दो पड़ाव जोड़ें।'), true);
    $('#rMsg').textContent = T('Planning on roads…', 'सड़कों पर रास्ता बन रहा है…');
    try {
      const d = await api('plan', { stops: RB.stops.join(','), mode: RB.mode, optimise: $('#rOpt').checked ? 1 : 0 }, { timeout: 45000 });
      RB.plan = d; RB.stops = d.order; stopsList(); drawMap(); $('#rMsg').textContent = '';
    } catch (e) { $('#rMsg').textContent = e.message; }
  }
  async function save() {
    const name = $('#rName').value.trim(); if (!name) return toast(T('Give the route a name.', 'रास्ते को नाम दें।'), true);
    if (RB.stops.length < 2) return toast(T('Add at least two stops.', 'कम से कम दो पड़ाव जोड़ें।'), true);
    const btn = $('#rSave'); btn.disabled = true;
    try {
      const data = { Name: name, Mode: RB.mode, StopPlaceIDs: RB.stops.join(',') };
      if (RB.cur && RB.cur.RouteID) data.RouteID = RB.cur.RouteID;
      const fresh = RB.plan && !RB.plan.saved;
      if (!fresh && RB.stops.join(',') !== RB.orig) data.GeometryJSON = '';
      if (fresh) { data.DistanceKm = RB.plan.distanceKm; data.DurationMin = RB.plan.durationMin; }
      const r = await api('save', { tab: 'Routes', data: JSON.stringify(data) });
      if (fresh) {
        post('saveRouteGeometry', { routeId: r.row.RouteID, stops: RB.stops.join(','), geometry: RB.plan.geometry, distanceKm: RB.plan.distanceKm, durationMin: RB.plan.durationMin });
        await new Promise(res => setTimeout(res, 2500));
        const chk = await api('route', { id: r.row.RouteID });
        if (!chk.geometry.length) toast(T('Route saved but the road line did not save. Press Save again.', 'रास्ता सेव हुआ पर सड़क की रेखा नहीं। फिर सेव दबाएँ।'), true);
      }
      await refreshStatic(); toast(T('Route saved', 'रास्ता सेव हुआ')); route();
    } catch (e) { toast(e.message, true); btn.disabled = false; }
  }
  $('#rNew').onclick = () => {
    const dep = places.find(p => p.Type === 'Depot'), mrf = places.find(p => p.Type === 'MRF');
    open({ Name: '', Mode: 'driving-car', StopPlaceIDs: [dep, mrf].filter(Boolean).map(p => p.PlaceID).join(',') });
    RB.orig = '';
  };
  $('#rAll').onclick = async () => {
    const msg = $('#rAllMsg'); $('#rAll').disabled = true; let ok = 0;
    for (const r of RB.routes) {
      msg.textContent = T('Drawing ', 'बन रहा है ') + r.Name + '…';
      try {
        const d = await api('plan', { stops: r.StopPlaceIDs, mode: r.Mode || 'driving-car', optimise: 0 }, { timeout: 45000 });
        if (!d.onRoad) { msg.textContent = d.note || 'No road route'; continue; }
        post('saveRouteGeometry', { routeId: r.RouteID, stops: d.order.join(','), geometry: d.geometry, distanceKm: d.distanceKm, durationMin: d.durationMin });
        await new Promise(res => setTimeout(res, 2200)); ok++;
      } catch (e) { msg.textContent = r.Name + ': ' + e.message; }
    }
    await refreshStatic(); toast(T('Roads drawn for ', 'सड़कें बनीं ') + ok + T(' routes', ' रास्तों के लिए')); route();
  };
  list(); form(); if (RB.routes.length) open(RB.routes[0]);
}

/* ---------- generic table editor ---------- */
async function crud(el, cfg) {
  const d = await api('list', { tab: cfg.tab });
  el.innerHTML = `<div class="card" style="margin-bottom:12px"><div class="row"><h3 style="margin:0">${esc(cfg.title)}</h3><div class="sp"></div>${cfg.noAdd ? '' : `<button class="btn sm" data-add>+ ${esc(T('Add', 'जोड़ें'))}</button>`}${cfg.extra || ''}</div>
    <div class="scroll" style="margin-top:8px"><table><thead><tr>${cfg.cols.map(c => `<th>${esc(c[1])}</th>`).join('')}<th></th></tr></thead><tbody>${d.rows.map((r, i) => `<tr>${cfg.cols.map(c => `<td>${esc(c[2] ? c[2](r) : r[c[0]])}</td>`).join('')}<td style="white-space:nowrap"><button class="btn sm grey" data-e="${i}">${esc(T('Edit', 'बदलें'))}</button>${cfg.noDel ? '' : ` <button class="btn sm grey" data-x="${i}">✕</button>`}</td></tr>`).join('')}</tbody></table></div></div>`;
  const key = { Households: 'HouseholdID', Vehicles: 'VehicleID', Users: 'UserID', Rates: 'Category' }[cfg.tab];
  const edit = async row => {
    const o = await editor(row ? T('Edit', 'बदलें') : T('Add', 'जोड़ें'), cfg.fields(), Object.assign({}, cfg.defaults || {}, row || {}));
    if (!o) return; if (row) o[key] = row[key];
    try { if (cfg.before) cfg.before(o); await api('save', { tab: cfg.tab, data: JSON.stringify(o) }); await refreshStatic(); toast(T('Saved', 'सेव हुआ')); route(); } catch (e) { toast(e.message, true); }
  };
  $$('[data-add]', el).forEach(b => b.onclick = () => edit(null));
  $$('[data-e]', el).forEach(b => b.onclick = () => edit(d.rows[+b.dataset.e]));
  $$('[data-x]', el).forEach(b => b.onclick = async () => { const r = d.rows[+b.dataset.x]; if (!confirm(T('Delete ', 'हटाएँ ') + r[key] + '?')) return; try { await api('del', { tab: cfg.tab, id: r[key] }); await refreshStatic(); route(); } catch (e) { toast(e.message, true); } });
  return d.rows;
}

function barRows(rows, total, color) {

  return rows.map(r => `<div class="hb"><span class="bl">${esc(r[0])}</span><span class="bt"><i style="width:${(100 * r[1] / mx).toFixed(1)}%;background:${color || 'var(--green2)'}"></i></span><span class="bv">${r[1]}${total ? ` <small>${Math.round(100 * r[1] / total)}%</small>` : ''}</span></div>`).join('');

function presTokens() { try { return JSON.parse(sessionStorage.getItem('ww_pres') || '{}'); } catch (e) { return {}; } }
function presHH() { try { return sessionStorage.getItem('ww_presHH') || ''; } catch (e) { return ''; } }
const PRES_ROLES = [['driver', 'Driver', 'चालक'], ['mrf', 'MRF', 'एमआरएफ'], ['incharge', 'In-charge', 'प्रभारी'], ['admin', 'Admin', 'एडमिन']];

function presenterOpen() {
  const have = presTokens();
  const m = modal(`<h3>${esc(T('Presenter mode', 'प्रस्तुतकर्ता मोड'))}</h3>
    <p class="muted" style="margin-bottom:8px">${esc(T('Sign in once. Then switch roles with one tap, and run the tour and Reset demo.', 'एक बार साइन इन करें। फिर एक टैप में भूमिका बदलें, टूर चलाएँ और डेमो रीसेट करें।'))}</p>
    ${PRES_ROLES.map(r => `<label class="f">${esc(T(r[1], r[2]))} ${have[r[0]] ? '✓' : ''}</label><input class="i" type="password" inputmode="numeric" autocomplete="off" data-r="${r[0]}" placeholder="${have[r[0]] ? esc(T('signed in, leave blank to keep', 'साइन इन है, रखने के लिए खाली छोड़ें')) : esc(T('passcode', 'पासकोड'))}">`).join('')}
    <label class="f">${esc(T('Demo household ID for the citizen screen (optional, like HH-013)', 'नागरिक स्क्रीन के लिए डेमो हाउसहोल्ड आईडी (वैकल्पिक, जैसे HH-013)'))}</label><input class="i" id="pHH" autocapitalize="characters" value="${esc(presHH())}">
    <div class="row" style="margin-top:14px"><button class="btn" id="pGo">${esc(T('Start presenting', 'प्रस्तुति शुरू करें'))}</button><button class="btn grey" id="pNo">${esc(T('Cancel', 'रद्द करें'))}</button></div><p class="muted" id="pMsg" style="margin-top:8px"></p>`);
  $('#pNo').onclick = m.close;
  $('#pGo').onclick = async () => {
    const out = presTokens(); const msg = $('#pMsg'); msg.textContent = T('Signing in…', 'साइन इन हो रहा है…');
    for (const inp of $$('input[data-r]', m.el)) {
      const code = inp.value.trim(); if (!code) continue;
      try {
        const d = await api('login', { role: inp.dataset.r, passcode: code, token: '' }, { timeout: 15000 });
        if (!d.valid) { msg.textContent = T('Wrong passcode for ', 'गलत पासकोड: ') + inp.dataset.r; return; }
        out[inp.dataset.r] = { token: d.token, name: d.name };
      } catch (e) { msg.textContent = e.message; return; }
    }
    try { sessionStorage.setItem('ww_pres', JSON.stringify(out)); const hh = $('#pHH').value.trim().toUpperCase(); if (hh) sessionStorage.setItem('ww_presHH', hh); else sessionStorage.removeItem('ww_presHH'); sessionStorage.setItem('ww_presOn', '1'); } catch (e) {}
    m.close(); presBar(); toast(T('Presenter mode is on', 'प्रस्तुतकर्ता मोड चालू'));
  };
}
async function presenterSwitch(role) {
  if (role === 'home') { location.hash = '#/'; route(); return true; }
  if (role === 'screen') { location.hash = '#/screen'; return true; }
  if (role === 'citizen') {
    S.token = S.role = S.name = null; try { ['ww_tok', 'ww_role', 'ww_name'].forEach(k => sessionStorage.removeItem(k)); } catch (e) {}
    const hh = presHH();
    if (hh) { try { localStorage.setItem('ww_hh', hh); } catch (e) {} } else { S.guest = true; try { sessionStorage.setItem('ww_guest', '1'); } catch (e) {} }
    if (location.hash === '#/citizen') route(); else location.hash = '#/citizen'; return true;
  }
  const t = presTokens()[role];
  if (!t) { toast(T('Sign in to ', 'साइन इन करें: ') + role + T(' first (Present button).', ' पहले (Present बटन)।'), true); presenterOpen(); return false; }
  S.token = t.token; S.role = role; S.name = t.name;
  try { sessionStorage.setItem('ww_tok', t.token); sessionStorage.setItem('ww_role', role); sessionStorage.setItem('ww_name', t.name); } catch (e) {}
  const to = HOME_OF[role]; if (location.hash === to) route(); else location.hash = to;
  return true;
}
async function presenterReset() {
  const t = presTokens().admin; if (!t) { toast(T('Sign in as Admin first (Present button).', 'पहले एडमिन से साइन इन करें (Present बटन)।'), true); presenterOpen(); return; }
  const m = modal(`<h3>${esc(T('Reset demo', 'डेमो रीसेट'))}</h3><p>${esc(T('This removes only the demo trips, pickups, receipts, alerts and demo households. Real places, routes and survey data stay.', 'यह सिर्फ डेमो ट्रिप, पिकअप, रसीदें, अलर्ट और डेमो घर हटाएगा। असली स्थान, रास्ते और सर्वे डेटा रहेंगे।'))}</p><div class="row" style="margin-top:12px"><button class="btn bad" id="rYes">${esc(T('Reset now', 'अभी रीसेट करें'))}</button><button class="btn grey" id="rNo">${esc(T('Cancel', 'रद्द करें'))}</button></div>`);
  $('#rNo').onclick = m.close;
  $('#rYes').onclick = async () => {
    $('#rYes').disabled = true;
    try { const r = await api('clearDemo', { token: t.token }, { timeout: 60000 }); m.close(); try { localStorage.removeItem('ww_hh'); } catch (e) {} S.st = null; toast(T('Demo reset: ', 'डेमो रीसेट: ') + Object.keys(r.removed || {}).map(k => k + ' ' + r.removed[k]).join(', ')); route(); }

function judgeQr() {

  $('#qClose').onclick = m.close;

function presBar() {
  let b = $('#presBar');
  let on = false; try { on = sessionStorage.getItem('ww_presOn') === '1'; } catch (e) {}
  if (!on) { if (b) b.remove(); document.body.classList.remove('pres'); return; }
  if (!b) { b = document.createElement('div'); b.id = 'presBar'; document.body.appendChild(b); }
  document.body.classList.add('pres');
  const chips = [['home', 'Home', 'होम'], ['citizen', 'Citizen', 'नागरिक'], ['driver', 'Driver', 'चालक'], ['mrf', 'MRF', 'एमआरएफ'], ['incharge', 'In-charge', 'प्रभारी'], ['admin', 'Admin', 'एडमिन'], ['screen', 'Screen', 'स्क्रीन']];
  b.innerHTML = `<div class="pb-row">${chips.map(c => `<button data-pr="${c[0]}">${esc(T(c[1], c[2]))}</button>`).join('')}<span class="pb-sp"></span><button data-pr="tour">▶ ${esc(T('Tour', 'टूर'))}</button><button data-pr="reset">♻ ${esc(T('Reset', 'रीसेट'))}</button><button data-pr="qr">QR</button><button data-pr="off">✕</button></div>`;
  $$('button[data-pr]', b).forEach(x => x.onclick = () => {
    const k = x.dataset.pr;

    if (k === 'off') { try { sessionStorage.removeItem('ww_presOn'); } catch (e) {} tourStop(); return presBar(); }
    presenterSwitch(k);
  });

const TOUR = [
  { hash: '#/evidence', anchor: 'ev1', t: ['1 · The problem', '1 · समस्या'], d: ['Daporijo has no formal collection system. Half of the households we surveyed burn their waste, and most say they have no space to separate it.', 'दापोरिजो में संग्रह की कोई औपचारिक व्यवस्था नहीं। हमारे सर्वे के आधे घर कचरा जलाते हैं, और ज़्यादातर के पास अलग करने की जगह नहीं।'] },
  { hash: '#/evidence', anchor: 'ev2', t: ['2 · The evidence', '2 · प्रमाण'], d: ['We collected data first: households, markets, road segments, scrap collectors and dump sites. The app is built from this, not from guesses.', 'हमने पहले डेटा जमा किया: घर, बाज़ार, सड़क खंड, कबाड़ वाले और कचरा-स्थल। ऐप इसी से बना है, अंदाज़े से नहीं।'] },
  { role: 'admin', admin: 'routes', t: ['3 · The route', '3 · रास्ता'], d: ['Real roads and numbered stops. The route is chosen from the road survey so a truck can actually enter.', 'असली सड़कें और क्रमवार पड़ाव। रास्ता सड़क सर्वे से चुना गया है ताकि ट्रक सच में जा सके।'] },
  { role: 'citizen', t: ['4 · The citizen', '4 · नागरिक'], d: ['A household registers, gets QR bag tags, and sees how far the truck is.', 'घर पंजीकरण करता है, QR बैग टैग पाता है और देखता है कि ट्रक कितनी दूर है।'] },
  { role: 'driver', t: ['5 · The driver', '5 · चालक'], d: ['The driver scans each bag, enters the weight, and can skip a blocked stop. Every pickup is recorded.', 'चालक हर बैग स्कैन करता है, वज़न लिखता है और बंद पड़ाव छोड़ सकता है। हर पिकअप दर्ज होता है।'] },
  { role: 'mrf', t: ['6 · The MRF', '6 · एमआरएफ'], d: ['The facility receives the load, sorts it and weighs each type. Dry waste becomes income (modelled at assumed rates).', 'केंद्र माल लेता है, छाँटता है और हर प्रकार तौलता है। सूखा कचरा आमदनी बनता है (मानी हुई दरों पर)।'] },
  { role: 'incharge', t: ['7 · The administration', '7 · प्रशासन'], d: ['The district in-charge sees live trucks, alerts and totals on one screen, and can decide.', 'ज़िला प्रभारी एक स्क्रीन पर लाइव ट्रक, अलर्ट और कुल देखता है और निर्णय ले सकता है।'] },
  { hash: '#/hill', t: ['8 · What comes next', '8 · आगे क्या'], d: ['Colonies where no vehicle can go. We walked Hill Top, mapped it and surveyed it. Next: a footpath service with a local carrier and a drop point at the road end.', 'जहाँ कोई वाहन नहीं जा सकता। हमने हिल टॉप पैदल नापा, नक्शा बनाया और सर्वे किया। आगे: स्थानीय वाहक और सड़क के सिरे पर ड्रॉप पॉइंट वाली पैदल सेवा।'] },
];
const TOUR_JUDGE = [0, 1, 7];
let tourI = -1;
function tourOpen() { return tourI >= 0; }
function tourStop() { tourI = -1; const b = $('#tourBar'); if (b) b.remove(); document.body.classList.remove('touring'); }
function tourSteps() { return presTokens().admin || presTokens().driver ? TOUR.map((s, i) => i) : TOUR_JUDGE; }
function tourStart() { tourI = 0; tourShow(0); }
async function tourShow(n) {
  const steps = tourSteps(); n = Math.max(0, Math.min(steps.length - 1, n)); tourI = n;
  const s = TOUR[steps[n]];
  if (s.role) {
    if (s.admin) adminTab = s.admin;
    const ok = await presenterSwitch(s.role);
    if (!ok) { tourStop(); return; }
  } else if (location.hash !== s.hash) { location.hash = s.hash; } else { route(); }
  let b = $('#tourBar'); if (!b) { b = document.createElement('div'); b.id = 'tourBar'; document.body.appendChild(b); }
  document.body.classList.add('touring');
  b.innerHTML = `<div class="tb-in"><div class="tb-top"><b class="tb-t">${esc(T(s.t[0], s.t[1]))}</b><span class="tb-n">${n + 1} / ${steps.length}</span></div><div class="tb-d">${esc(T(s.d[0], s.d[1]))}</div>
    <div class="tb-btn"><button class="btn grey" id="tbBack" ${n === 0 ? 'disabled' : ''}>← ${esc(T('Back', 'पीछे'))}</button><button class="btn grey" id="tbEnd">${esc(T('Exit', 'बाहर'))}</button><button class="btn big" id="tbNext">${n === steps.length - 1 ? esc(T('Finish', 'पूरा')) : esc(T('Next', 'आगे')) + ' →'}</button></div></div>`;
  $('#tbBack').onclick = () => tourShow(n - 1);
  $('#tbEnd').onclick = tourStop;
  $('#tbNext').onclick = () => { if (n >= steps.length - 1) tourStop(); else tourShow(n + 1); };
  if (s.anchor) setTimeout(() => { const el = document.getElementById(s.anchor); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 400);
  else window.scrollTo(0, 0);
}
window.addEventListener('keydown', e => { if (!tourOpen()) return; if (e.key === 'ArrowRight') $('#tbNext') && $('#tbNext').click(); if (e.key === 'ArrowLeft') $('#tbBack') && $('#tbBack').click(); if (e.key === 'Escape') tourStop(); });
window.addEventListener('load', () => { setTimeout(presBar, 0); });
</script>
</body>
